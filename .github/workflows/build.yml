name: Build vEGPU

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, for example 0.1.0"
        required: false
        type: string
      build_number:
        description: "Build number. Defaults to GitHub run number."
        required: false
        type: string
      mode:
        description: "artifact-only keeps workflow artifacts only; pre-release publishes a prerelease; full-release publishes a stable release."
        required: true
        default: artifact-only
        type: choice
        options:
          - artifact-only
          - pre-release
          - full-release
      build_scope:
        description: "What to build. display-runtime-only is for ANGLE/display debugging and does not touch Machine/QEMU."
        required: true
        default: package
        type: choice
        options:
          - package
          - display-runtime-only
      display_mode:
        description: "How this workflow obtains the app display runtime. app-run reuses a prior vEGPU workflow artifact; build rebuilds ANGLE/SPICE."
        required: true
        default: app-run
        type: choice
        options:
          - app-run
          - build
      display_artifact_run_id:
        description: "Existing vEGPU workflow run id containing display runtime artifacts when display_mode=app-run."
        required: false
        type: string
      scaling_mode:
        description: "How this workflow obtains the Linux scaling helper package. app-run reuses a prior vEGPU workflow artifact."
        required: true
        default: app-run
        type: choice
        options:
          - app-run
          - build
      scaling_artifact_run_id:
        description: "Existing vEGPU workflow run id containing vEGPU-scaling-package when scaling_mode=app-run."
        required: false
        type: string
      utm_repository:
        description: "UTM fork/repo that supplies the app display dependency recipe."
        required: false
        default: https://github.com/utmapp/UTM.git
        type: string
      utm_commit:
        description: "UTM commit that supplies the app display dependency recipe."
        required: false
        default: e4a4c34b671284263fc69f81b607de494d7e9b65
        type: string
      machine_mode:
        description: "How this workflow obtains vEGPU Machine. trigger rebuilds Machine/DKMS; app-run reuses a prior vEGPU workflow artifact."
        required: true
        default: app-run
        type: choice
        options:
          - app-run
          - download-run
          - trigger
      machine_app_run_id:
        description: "Existing vEGPU workflow run id containing vEGPU-machine-artifacts when machine_mode=app-run."
        required: false
        type: string
      machine_repository:
        description: "Machine repo used for download-run/trigger."
        required: false
        default: openresearchtools/vEGPU-machine
        type: string
      machine_ref:
        description: "Machine branch/ref used when triggering its workflow."
        required: false
        default: main
        type: string
      machine_run_id:
        description: "Existing Machine workflow run id when machine_mode=download-run."
        required: false
        type: string
      llama_runtime_tag:
        description: "llama.cpp runtime release tag from openresearchtools/llama-cpp-arm64-builds. Use latest for newest stable."
        required: false
        default: latest
        type: string
      display_partial_run_id:
        description: "Optional vEGPU run id containing vEGPU-display-runtime-partial to resume a failed display build."
        required: false
        type: string
      publish_release:
        description: "Manual override: create/update a GitHub release even when mode is artifact-only."
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub release as prerelease."
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

env:
  CONFIGURATION: release
  RELEASE_VERSION: ${{ inputs.release_version || '0.1.0' }}
  BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
  DISPLAY_SOURCE_REQUIRED: true
  MACOS_ARTIFACT_ABI: macos26-arm64

jobs:
  source-check:
    name: Verify source tree
    runs-on: ubuntu-24.04

    steps:
      - name: Check out vEGPU
        uses: actions/checkout@v6

      - name: Install verifier tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file ripgrep

      - name: Verify no generated/local payloads
        run: scripts/verify-clean-repo.sh

  display-runtime:
    name: Build display runtime from source
    runs-on: macos-26
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    env:
      DISPLAY_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.display_mode || 'app-run') || 'app-run' }}
      DISPLAY_ARTIFACT_RUN_ID: ${{ inputs.display_artifact_run_id || vars.VEGPU_DISPLAY_ARTIFACT_RUN_ID || '' }}

    steps:
      - name: Check out vEGPU
        uses: actions/checkout@v6

      - name: Validate display runtime mode
        run: |
          case "${DISPLAY_MODE}" in
            app-run|build) ;;
            *)
              echo "display_mode must be app-run or build" >&2
              exit 1
              ;;
          esac

      - name: Require display runtime artifact run
        if: ${{ env.DISPLAY_MODE == 'app-run' }}
        run: |
          if [ "${DISPLAY_MODE}" = "app-run" ] && [ -z "${DISPLAY_ARTIFACT_RUN_ID}" ]; then
            echo "display_mode=app-run requires display_artifact_run_id" >&2
            exit 1
          fi

      - name: Download display runtime artifacts from prior vEGPU workflow run
        if: ${{ env.DISPLAY_MODE == 'app-run' }}
        run: |
          mkdir -p \
            "$RUNNER_TEMP/vegpu-artifacts/display-frameworks/macos-arm64" \
            "$RUNNER_TEMP/vegpu-artifacts/display-runtime-source"
          gh run download "$DISPLAY_ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name vEGPU-display-frameworks-macos26-arm64 \
            --dir "$RUNNER_TEMP/vegpu-artifacts/display-frameworks/macos-arm64"
          gh run download "$DISPLAY_ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name vEGPU-display-runtime-source-macos26-arm64 \
            --dir "$RUNNER_TEMP/vegpu-artifacts/display-runtime-source"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Restore display runtime artifact cache
        id: display-runtime-artifact-cache
        if: ${{ env.DISPLAY_MODE == 'build' }}
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/vegpu-artifacts/display-frameworks/macos-arm64
            ${{ runner.temp }}/vegpu-artifacts/display-runtime-source/display-runtime-source.tar.gz
          key: ${{ env.MACOS_ARTIFACT_ABI }}-display-runtime-artifacts-v3-${{ inputs.utm_commit || vars.VEGPU_UTM_COMMIT || 'e4a4c34b671284263fc69f81b607de494d7e9b65' }}-${{ hashFiles('scripts/build-display-runtime-from-source.sh', 'scripts/normalize-display-frameworks.sh', 'third_party/utm/patches/*.patch') }}

      - name: Install display-runtime build requirements
        if: ${{ env.DISPLAY_MODE == 'build' && steps.display-runtime-artifact-cache.outputs.cache-hit != 'true' }}
        run: |
          brew update
          brew install \
            bison \
            pkg-config \
            gettext \
            glib-utils \
            libgpg-error \
            nasm \
            make \
            meson \
            cmake \
            llvm \
            spirv-llvm-translator \
            libxcb \
            libxrandr
          python3 -m pip install --break-system-packages --user \
            six \
            pyparsing \
            pyyaml \
            setuptools \
            distlib \
            mako
          echo "/usr/local/opt/bison/bin:/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"

      - name: Cache display runtime build directory
        if: ${{ env.DISPLAY_MODE == 'build' && steps.display-runtime-artifact-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/vegpu-build/display-runtime-source-build
          key: ${{ env.MACOS_ARTIFACT_ABI }}-display-runtime-work-v3-${{ inputs.utm_commit || vars.VEGPU_UTM_COMMIT || 'e4a4c34b671284263fc69f81b607de494d7e9b65' }}-${{ hashFiles('scripts/build-display-runtime-from-source.sh', 'scripts/normalize-display-frameworks.sh', 'third_party/utm/patches/*.patch') }}
          restore-keys: |
            ${{ env.MACOS_ARTIFACT_ABI }}-display-runtime-work-v3-${{ inputs.utm_commit || vars.VEGPU_UTM_COMMIT || 'e4a4c34b671284263fc69f81b607de494d7e9b65' }}-
            ${{ env.MACOS_ARTIFACT_ABI }}-display-runtime-work-v3-

      - name: Restore failed display runtime partial artifact
        if: ${{ env.DISPLAY_MODE == 'build' && steps.display-runtime-artifact-cache.outputs.cache-hit != 'true' && inputs.display_partial_run_id != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/vegpu-input/display-runtime-partial"
          gh run download "$DISPLAY_PARTIAL_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name vEGPU-display-runtime-partial \
            --dir "$RUNNER_TEMP/vegpu-input/display-runtime-partial"
          partial="$RUNNER_TEMP/vegpu-input/display-runtime-partial/display-runtime-partial.tar.gz"
          test -f "$partial"
          mkdir -p "$RUNNER_TEMP/vegpu-build"
          tar -xzf "$partial" -C "$RUNNER_TEMP/vegpu-build"
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_PARTIAL_RUN_ID: ${{ inputs.display_partial_run_id }}

      - name: Build app-side display frameworks and source bundle
        id: build-display-runtime
        if: ${{ env.DISPLAY_MODE == 'build' && steps.display-runtime-artifact-cache.outputs.cache-hit != 'true' }}
        run: scripts/build-display-runtime-from-source.sh
        env:
          VGPU_UTM_REPO: ${{ inputs.utm_repository || vars.VEGPU_UTM_REPO || 'https://github.com/utmapp/UTM.git' }}
          VGPU_UTM_COMMIT: ${{ inputs.utm_commit || vars.VEGPU_UTM_COMMIT || 'e4a4c34b671284263fc69f81b607de494d7e9b65' }}
          VGPU_DISPLAY_BUILD_DIR: ${{ runner.temp }}/vegpu-build/display-runtime-source-build
          VGPU_DISPLAY_FRAMEWORKS_OUT: ${{ runner.temp }}/vegpu-artifacts/display-frameworks/macos-arm64
          VGPU_DISPLAY_SOURCE_OUT: ${{ runner.temp }}/vegpu-artifacts/display-runtime-source/display-runtime-source.tar.gz

      - name: Pack failed display runtime partial state
        if: ${{ failure() && env.DISPLAY_MODE == 'build' && steps.display-runtime-artifact-cache.outputs.cache-hit != 'true' }}
        run: |
          work="$RUNNER_TEMP/vegpu-build/display-runtime-source-build"
          out="$RUNNER_TEMP/vegpu-artifacts/display-runtime-partial/display-runtime-partial.tar.gz"
          test -d "$work"
          mkdir -p "$(dirname "$out")"
          tar \
            --exclude='*/.git' \
            --exclude='*/.git/*' \
            --exclude='*/DerivedData/*/Index.noindex' \
            --exclude='*/Index.noindex' \
            -czf "$out" \
            -C "$RUNNER_TEMP/vegpu-build" \
            display-runtime-source-build

      - name: Upload failed display runtime partial state
        if: ${{ failure() && env.DISPLAY_MODE == 'build' && steps.display-runtime-artifact-cache.outputs.cache-hit != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: vEGPU-display-runtime-partial
          path: ${{ runner.temp }}/vegpu-artifacts/display-runtime-partial/display-runtime-partial.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Verify display runtime outputs
        run: |
          FRAMEWORKS="$RUNNER_TEMP/vegpu-artifacts/display-frameworks/macos-arm64"
          SOURCE="$RUNNER_TEMP/vegpu-artifacts/display-runtime-source/display-runtime-source.tar.gz"
          test -d "$FRAMEWORKS/spice-client-glib-2.0.8.framework"
          test -d "$FRAMEWORKS/EGL.framework"
          test -d "$FRAMEWORKS/GLESv2.framework"
          if [ "${DISPLAY_MODE}" = "build" ]; then
            scripts/normalize-display-frameworks.sh --check "$FRAMEWORKS"
          fi
          otool -D "$FRAMEWORKS/EGL.framework/Versions/A/EGL" | grep -F '@rpath/EGL.framework/Versions/A/EGL'
          otool -D "$FRAMEWORKS/GLESv2.framework/Versions/A/GLESv2" | grep -F '@rpath/GLESv2.framework/Versions/A/GLESv2'
          test -f "$SOURCE"
          tar -tzf "$SOURCE" | grep -F 'display-runtime-source/README'
          tar -tzf "$SOURCE" | grep -F 'display-runtime-source/utm-patches/sources'
          tar -tzf "$SOURCE" | grep -F 'display-runtime-source/git-sources/utm-base/utm-base-'
          tar -tzf "$SOURCE" | grep -F 'display-runtime-source/git-sources/WebKit.git/WebKit-source.tar.gz'
          tar -tzf "$SOURCE" | grep -F 'display-runtime-source/git-sources/WebKit.git/HEAD'
          tar -tzf "$SOURCE" | grep -F 'display-runtime-source/git-sources/WebKit.git/REMOTE'
          tar -tzf "$SOURCE" | grep -F 'display-runtime-source/git-sources/libucontext.git/libucontext-source.tar.gz'
          tar -tzf "$SOURCE" | grep -F 'display-runtime-source/git-sources/libepoxy.git/libepoxy-source.tar.gz'
          tar -tzf "$SOURCE" | grep -F 'display-runtime-source/vegpu-utm-patches/0001-openresearchtools-vegpu-cocoaspice-package.patch'
          strings "$FRAMEWORKS/spice-client-glib-2.0.8.framework/Versions/A/spice-client-glib-2.0.8" |
            grep -F 'SPICE_DISABLE_GL_SCANOUT'

      - name: Upload display frameworks
        if: ${{ env.DISPLAY_MODE == 'build' }}
        uses: actions/upload-artifact@v7
        with:
          name: vEGPU-display-frameworks-macos26-arm64
          path: ${{ runner.temp }}/vegpu-artifacts/display-frameworks/macos-arm64
          if-no-files-found: error
          retention-days: 90

      - name: Upload display runtime source bundle
        if: ${{ env.DISPLAY_MODE == 'build' }}
        uses: actions/upload-artifact@v7
        with:
          name: vEGPU-display-runtime-source-macos26-arm64
          path: ${{ runner.temp }}/vegpu-artifacts/display-runtime-source/display-runtime-source.tar.gz
          if-no-files-found: error
          retention-days: 90

  scaling-package:
    name: Build Linux scaling helper package
    runs-on: ubuntu-24.04
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.build_scope || 'package') == 'package') || startsWith(github.ref, 'refs/tags/') }}
    env:
      SCALING_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.scaling_mode || 'app-run') || 'app-run' }}
      SCALING_ARTIFACT_RUN_ID: ${{ inputs.scaling_artifact_run_id || vars.VEGPU_SCALING_ARTIFACT_RUN_ID || '' }}

    steps:
      - name: Check out vEGPU
        uses: actions/checkout@v6

      - name: Validate scaling package mode
        run: |
          case "${SCALING_MODE}" in
            app-run|build) ;;
            *)
              echo "scaling_mode must be app-run or build" >&2
              exit 1
              ;;
          esac

      - name: Resolve latest scaling package artifact run
        if: ${{ env.SCALING_MODE == 'app-run' && env.SCALING_ARTIFACT_RUN_ID == '' }}
        run: |
          pages="$RUNNER_TEMP/vegpu-actions-artifacts.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > "$pages"
          run_id="$(python3 scripts/resolve-artifact-run.py "$pages" vEGPU-scaling-package)"
          test -n "$run_id"
          echo "SCALING_ARTIFACT_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "Resolved scaling package artifact from vEGPU run $run_id"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Require scaling package artifact run
        if: ${{ env.SCALING_MODE == 'app-run' }}
        run: |
          if [ "${SCALING_MODE}" = "app-run" ] && [ -z "${SCALING_ARTIFACT_RUN_ID}" ]; then
            echo "scaling_mode=app-run requires scaling_artifact_run_id" >&2
            exit 1
          fi

      - name: Download scaling package from prior vEGPU workflow run
        if: ${{ env.SCALING_MODE == 'app-run' }}
        run: |
          mkdir -p "$RUNNER_TEMP/vegpu-artifacts/scaling-package"
          gh run download "$SCALING_ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name vEGPU-scaling-package \
            --dir "$RUNNER_TEMP/vegpu-artifacts/scaling-package"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Restore scaling package cache
        id: scaling-package-cache
        if: ${{ env.SCALING_MODE == 'build' }}
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/vegpu-artifacts/scaling-package
          key: ${{ runner.os }}-scaling-package-v2-${{ hashFiles('scripts/build-scaling-app-package.sh', 'Resources/Guest/scaling-app/**') }}

      - name: Build Debian package in disposable Debian
        if: ${{ env.SCALING_MODE == 'build' && steps.scaling-package-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/vegpu-artifacts/scaling-package" "$RUNNER_TEMP/vegpu-build/scaling-app-deb"
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace \
            debian:trixie-slim \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates coreutils dpkg-dev findutils
              VEGPU_SCALING_ARCH=arm64 \
              VEGPU_SCALING_PACKAGE_OUT=/runner-temp/vegpu-artifacts/scaling-package \
              VEGPU_SCALING_BUILD_DIR=/runner-temp/vegpu-build/scaling-app-deb \
              scripts/build-scaling-app-package.sh
            '

      - name: Validate Debian package
        run: |
          OUT="$RUNNER_TEMP/vegpu-artifacts/scaling-package"
          test -f "$OUT/SHA512SUMS"
          package="$(find "$OUT" -maxdepth 1 -type f -name 'vegpu-scaling_*.deb' -print -quit)"
          test -n "$package"
          (cd "$OUT" && sha512sum -c SHA512SUMS)
          dpkg-deb -c "$package" | grep -F './usr/share/doc/vegpu-scaling/copyright'

      - name: Upload scaling package
        uses: actions/upload-artifact@v7
        with:
          name: vEGPU-scaling-package
          path: ${{ runner.temp }}/vegpu-artifacts/scaling-package
          if-no-files-found: error
          retention-days: 90

  llama-runtime:
    name: Fetch bundled llama.cpp runtime
    runs-on: ubuntu-24.04
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.build_scope || 'package') == 'package') || startsWith(github.ref, 'refs/tags/') }}
    outputs:
      cache_key: ${{ steps.resolve.outputs.cache_key }}
    env:
      LLAMA_RUNTIME_TAG: ${{ inputs.llama_runtime_tag || 'latest' }}

    steps:
      - name: Check out vEGPU
        uses: actions/checkout@v6

      - name: Resolve and download llama.cpp runtime assets
        id: resolve
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vegpu-artifacts/llama-runtime/archives"
          gh api "repos/openresearchtools/llama-cpp-arm64-builds/releases?per_page=100" > "$RUNNER_TEMP/llama-releases.json"
          python3 - "$RUNNER_TEMP/llama-releases.json" "$RUNNER_TEMP/vegpu-artifacts/llama-runtime" "$LLAMA_RUNTIME_TAG" <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          releases = json.loads(Path(sys.argv[1]).read_text())
          out = Path(sys.argv[2])
          requested = sys.argv[3].strip()

          def body_field(body, name):
              match = re.search(rf"(?m)^{re.escape(name)}:\s*`([^`]+)`", body or "")
              return match.group(1).strip() if match else ""

          chosen = None
          for item in releases:
              if item.get("draft") or item.get("prerelease"):
                  continue
              source = body_field(item.get("body", ""), "Source")
              if source != "ggml-org/llama.cpp":
                  continue
              if requested.lower() == "latest" or item.get("tag_name") == requested:
                  chosen = item
                  break
          if chosen is None:
              raise SystemExit(f"llama runtime release not found: {requested}")

          assets = {asset["name"]: asset for asset in chosen.get("assets", [])}
          required = {
              "macos": "-bin-macos-arm64.tar.gz",
              "cuda13": "-bin-debian-trixie-cuda13-arm64.tar.gz",
              "vulkan": "-bin-debian-trixie-vulkan-arm64.tar.gz",
          }
          selected = {}
          for key, suffix in required.items():
              matches = [asset for name, asset in assets.items() if name.endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit(f"expected exactly one {suffix} asset, found {len(matches)}")
              selected[key] = matches[0]

          def body_sha(name):
              body = chosen.get("body", "")
              match = re.search(rf"(?im){re.escape(name)}.*?sha256[:=]\s*([a-f0-9]{{64}})", body)
              return match.group(1).lower() if match else ""

          manifest_assets = {}
          for key, asset in selected.items():
              dest = out / "archives" / asset["name"]
              subprocess.run(["curl", "-fL", "--retry", "5", "--retry-delay", "3", "-o", str(dest), asset["browser_download_url"]], check=True)
              actual = hashlib.sha256(dest.read_bytes()).hexdigest()
              expected = body_sha(asset["name"])
              if expected and actual.lower() != expected:
                  raise SystemExit(f"sha256 mismatch for {asset['name']}")
              manifest_assets[key] = {
                  "name": asset["name"],
                  "path": f"archives/{asset['name']}",
                  "size": int(asset.get("size") or dest.stat().st_size),
                  "sha256": actual,
                  "downloadURL": asset["browser_download_url"],
              }

          manifest = {
              "schemaVersion": 1,
              "family": "llama",
              "tag": chosen["tag_name"],
              "name": chosen.get("name") or chosen["tag_name"],
              "publishedAt": chosen.get("published_at") or "",
              "source": "ggml-org/llama.cpp",
              "sourceRef": body_field(chosen.get("body", ""), "Source ref"),
              "assets": manifest_assets,
          }
          (out / "llama-runtime-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          cache_key = "llama-runtime-" + chosen["tag_name"] + "-" + hashlib.sha256(json.dumps(manifest, sort_keys=True).encode()).hexdigest()[:16]
          print(f"cache_key={cache_key}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"cache_key={cache_key}\n")
          PY
          find "$RUNNER_TEMP/vegpu-artifacts/llama-runtime" -maxdepth 2 -type f -print | sort
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload bundled llama.cpp runtime
        uses: actions/upload-artifact@v7
        with:
          name: vEGPU-llama-runtime-bootstrap
          path: ${{ runner.temp }}/vegpu-artifacts/llama-runtime
          if-no-files-found: error
          retention-days: 90

  build-app:
    name: Build vEGPU.app
    runs-on: macos-26
    needs:
      - display-runtime
      - scaling-package
      - llama-runtime
    if: ${{ ((github.event_name == 'workflow_dispatch' && (inputs.build_scope || 'package') == 'package') || startsWith(github.ref, 'refs/tags/')) && needs.display-runtime.result == 'success' && needs.scaling-package.result == 'success' && needs.llama-runtime.result == 'success' }}
    env:
      DISPLAY_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.display_mode || 'app-run') || 'app-run' }}
      DISPLAY_ARTIFACT_RUN_ID: ${{ inputs.display_artifact_run_id || vars.VEGPU_DISPLAY_ARTIFACT_RUN_ID || '' }}

    steps:
      - name: Check out vEGPU
        uses: actions/checkout@v6

      - name: Restore vEGPU.app artifact cache
        id: app-artifact-cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/vegpu-artifacts/app/vEGPU.app
            ${{ runner.temp }}/vegpu-artifacts/legal/generated
          key: ${{ env.MACOS_ARTIFACT_ABI }}-vegpu-app-v3-${{ env.RELEASE_VERSION }}-${{ env.BUILD_NUMBER }}-${{ needs.llama-runtime.outputs.cache_key }}-${{ inputs.utm_commit || vars.VEGPU_UTM_COMMIT || 'e4a4c34b671284263fc69f81b607de494d7e9b65' }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift', 'Resources/**', 'Helpers/**', 'ai/**/*.go', 'ai/**/*.mod', 'ai/**/*.sum', 'ai/**/*.yaml', 'ai/**/*.yml', 'ai/web-ui-app/static/**', 'scripts/build-app-bundle.sh', 'scripts/build-legal-bundle.sh', 'scripts/apply-utm-patches.sh', 'scripts/build-display-runtime-from-source.sh', 'scripts/normalize-display-frameworks.sh', 'scripts/build-scaling-app-package.sh', 'third_party/**', 'legal/**', 'docs/**') }}

      - name: Download display runtime artifacts from prior vEGPU workflow run
        if: ${{ steps.app-artifact-cache.outputs.cache-hit != 'true' && env.DISPLAY_MODE == 'app-run' }}
        run: |
          if [ -z "${DISPLAY_ARTIFACT_RUN_ID}" ]; then
            echo "display_mode=app-run requires display_artifact_run_id" >&2
            exit 1
          fi
          mkdir -p \
            "$RUNNER_TEMP/vegpu-input/display-frameworks/macos-arm64" \
            "$RUNNER_TEMP/vegpu-input/display-runtime-source"
          gh run download "$DISPLAY_ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name vEGPU-display-frameworks-macos26-arm64 \
            --dir "$RUNNER_TEMP/vegpu-input/display-frameworks/macos-arm64"
          gh run download "$DISPLAY_ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name vEGPU-display-runtime-source-macos26-arm64 \
            --dir "$RUNNER_TEMP/vegpu-input/display-runtime-source"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download source-built display frameworks
        if: ${{ steps.app-artifact-cache.outputs.cache-hit != 'true' && env.DISPLAY_MODE == 'build' }}
        uses: actions/download-artifact@v8
        with:
          name: vEGPU-display-frameworks-macos26-arm64
          path: ${{ runner.temp }}/vegpu-input/display-frameworks/macos-arm64

      - name: Download display runtime source bundle
        if: ${{ steps.app-artifact-cache.outputs.cache-hit != 'true' && env.DISPLAY_MODE == 'build' }}
        uses: actions/download-artifact@v8
        with:
          name: vEGPU-display-runtime-source-macos26-arm64
          path: ${{ runner.temp }}/vegpu-input/display-runtime-source

      - name: Download Linux scaling helper package
        if: steps.app-artifact-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: vEGPU-scaling-package
          path: ${{ runner.temp }}/vegpu-input/scaling-package

      - name: Download bundled llama.cpp runtime
        if: steps.app-artifact-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: vEGPU-llama-runtime-bootstrap
          path: ${{ runner.temp }}/vegpu-input/llama-runtime

      - name: Set up Go
        if: steps.app-artifact-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: ai/web-ui-app/go.mod
          cache-dependency-path: |
            ai/web-ui-app/go.mod
            ai/web-ui-app/go.sum
            ai/gost-local-proxy/go.mod

      - name: Cache SwiftPM build directory
        if: steps.app-artifact-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/vegpu-build/swiftpm-release
          key: ${{ env.MACOS_ARTIFACT_ABI }}-swiftpm-release-v3-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift') }}
          restore-keys: |
            ${{ env.MACOS_ARTIFACT_ABI }}-swiftpm-release-v3-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            ${{ env.MACOS_ARTIFACT_ABI }}-swiftpm-release-v3-

      - name: Cache patched UTM package worktree
        if: steps.app-artifact-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/vegpu-build/utm-patched
          key: ${{ env.MACOS_ARTIFACT_ABI }}-utm-patched-v3-${{ inputs.utm_commit || vars.VEGPU_UTM_COMMIT || 'e4a4c34b671284263fc69f81b607de494d7e9b65' }}-${{ hashFiles('third_party/utm/patches/*.patch', 'scripts/apply-utm-patches.sh') }}

      - name: Build vEGPU.app
        if: steps.app-artifact-cache.outputs.cache-hit != 'true'
        run: |
          export VEGPU_REQUIRE_FULL_SOURCE=1
          CONFIGURATION="${CONFIGURATION}" scripts/build-app-bundle.sh
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          SWIFT_BUILD_SCRATCH_PATH: ${{ runner.temp }}/vegpu-build/swiftpm-release
          VEGPU_APP: ${{ runner.temp }}/vegpu-artifacts/app/vEGPU.app
          VEGPU_APP_BUILD_DIR: ${{ runner.temp }}/vegpu-build/app-build
          VEGPU_DISPLAY_FRAMEWORKS_OUT: ${{ runner.temp }}/vegpu-input/display-frameworks/macos-arm64
          VEGPU_DISPLAY_SOURCE_OUT: ${{ runner.temp }}/vegpu-input/display-runtime-source/display-runtime-source.tar.gz
          VEGPU_LEGAL_BUILD_DIR: ${{ runner.temp }}/vegpu-artifacts/legal/generated
          VEGPU_SCALING_PACKAGE_DIR: ${{ runner.temp }}/vegpu-input/scaling-package
          VEGPU_BOOTSTRAP_LLAMA_RUNTIME_DIR: ${{ runner.temp }}/vegpu-input/llama-runtime
          VEGPU_UTM_PATCHED_WORKTREE: ${{ runner.temp }}/vegpu-build/utm-patched

      - name: Validate app bundle and notices
        run: |
          APP="$RUNNER_TEMP/vegpu-artifacts/app/vEGPU.app"
          codesign --verify --deep --strict "$APP"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "com.vegpu.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "${RELEASE_VERSION}"
          test "$(plutil -extract CFBundleVersion raw -o - "$APP/Contents/Info.plist")" = "${BUILD_NUMBER}"
          test -f "$APP/Contents/Resources/vEGPURoot/legal/generated/NOTICES"
          test -f "$APP/Contents/Resources/vEGPURoot/legal/generated/NOTICES.md"
          test -f "$APP/Contents/Resources/vEGPURoot/legal/generated/LICENSES"
          test -f "$APP/Contents/Resources/vEGPURoot/legal/generated/manifest.json"
          test -f "$APP/Contents/Resources/vEGPURoot/legal/generated/license-files/ANGLE-LICENSE.txt"
          test -f "$APP/Contents/Resources/vEGPURoot/legal/generated/license-files/ANGLE-SOURCE.md"
          test -f "$APP/Contents/Resources/vEGPURoot/legal/generated/license-files/ANGLE-IMPORT.txt"
          test -d "$APP/Contents/Resources/vEGPURoot/legal/generated/license-files/display-runtime"
          test -d "$APP/Contents/Resources/vEGPURoot/legal/generated/license-files/llama-runtime"
          find "$APP/Contents/Resources/vEGPURoot/legal/generated/license-files/swiftpm" -type f -iname 'LICENSE*' | grep -Ei '/swiftterm/'
          find "$APP/Contents/Resources/vEGPURoot/legal/generated/license-files/swiftpm" -type f -iname 'LICENSE*' | grep -Ei '/swift-argument-parser/'
          scripts/normalize-display-frameworks.sh --check "$APP/Contents/Frameworks"
          otool -D "$APP/Contents/Frameworks/EGL.framework/Versions/A/EGL" | grep -F '@rpath/EGL.framework/Versions/A/EGL'
          otool -D "$APP/Contents/Frameworks/GLESv2.framework/Versions/A/GLESv2" | grep -F '@rpath/GLESv2.framework/Versions/A/GLESv2'
          test -f "$APP/Contents/Resources/vEGPURoot/legal/generated/source/vEGPU-app-source.tar.gz"
          test -f "$APP/Contents/Resources/vEGPURoot/legal/generated/source/display-runtime-source.tar.gz"
          tar -tzf "$APP/Contents/Resources/vEGPURoot/legal/generated/source/display-runtime-source.tar.gz" | grep -F 'display-runtime-source/git-sources/WebKit.git/WebKit-source.tar.gz'
          tar -tzf "$APP/Contents/Resources/vEGPURoot/legal/generated/source/display-runtime-source.tar.gz" | grep -F 'display-runtime-source/git-sources/libucontext.git/libucontext-source.tar.gz'
          test -f "$APP/Contents/Resources/vEGPURoot/Resources/Guest/reconcile-llama-runtimes.sh"
          find "$APP/Contents/Resources/vEGPURoot/Resources/Guest/scaling-app/package" -maxdepth 1 -type f -name 'vegpu-scaling_*.deb' -print -quit | grep -q .
          test -f "$APP/Contents/Resources/vEGPURoot/ai/bootstrap-runtimes/llama/llama-runtime-manifest.json"
          find "$APP/Contents/Resources/vEGPURoot/ai/bootstrap-runtimes/llama/archives" -maxdepth 1 -type f -name '*-bin-macos-arm64.tar.gz' -print -quit | grep -q .
          find "$APP/Contents/Resources/vEGPURoot/ai/bootstrap-runtimes/llama/archives" -maxdepth 1 -type f -name '*-bin-debian-trixie-cuda13-arm64.tar.gz' -print -quit | grep -q .
          find "$APP/Contents/Resources/vEGPURoot/ai/bootstrap-runtimes/llama/archives" -maxdepth 1 -type f -name '*-bin-debian-trixie-vulkan-arm64.tar.gz' -print -quit | grep -q .
          test "$(find "$APP/Contents/Resources/vEGPURoot/legal/generated/license-files/display-runtime" -type f | wc -l | tr -d ' ')" -ge 20
          test "$(find "$APP/Contents/Resources/vEGPURoot/legal/generated/license-files/llama-runtime" -type f | wc -l | tr -d ' ')" -ge 3
          find "$APP/Contents/Resources/vEGPURoot/legal/generated/license-files/display-runtime/upstream-sources" -type f | grep -F '/glib-2.83.0/'
          find "$APP/Contents/Resources/vEGPURoot/legal/generated/license-files/display-runtime/upstream-sources" -type f | grep -F '/openssl-1.1.1b/'
          find "$APP/Contents/Resources/vEGPURoot/legal/generated/license-files/display-runtime/upstream-sources" -type f | grep -F '/gstreamer-1.19.1/'
          find "$APP/Contents/Resources/vEGPURoot/legal/generated/license-files/llama-runtime" -type f | grep -F 'llama-b9500'
          if tar -tzf "$APP/Contents/Resources/vEGPURoot/legal/generated/source/vEGPU-app-source.tar.gz" | grep -E 'Resources/Guest/scaling-app/(build|package)/|[.]deb$|__pycache__|[.]pyc$'; then
            echo "generated app source tarball must not include scaling helper build artifacts" >&2
            exit 1
          fi
          if find "$APP/Contents/Resources/vEGPURoot" -maxdepth 2 -name 'THIRD_PARTY_*' -print -quit | grep -q .; then
            echo "legacy THIRD_PARTY notice files must not be bundled" >&2
            exit 1
          fi
          grep -F 'EXTERNAL vEGPU Machine Licenses' "$APP/Contents/Resources/vEGPURoot/legal/generated/NOTICES"
          grep -F 'ThirdPartyNotices/LICENSES' "$APP/Contents/Resources/vEGPURoot/legal/generated/NOTICES"
          grep -F 'For convenience, vEGPU.app Help can render external vEGPU Machine notices and licenses' "$APP/Contents/Resources/vEGPURoot/legal/generated/NOTICES"
          grep -F 'The Help menu marks those Machine-owned rows as EXTERNAL' "$APP/Contents/Resources/vEGPURoot/legal/generated/NOTICES"
          grep -F 'visible architecture, repository, license, notice, and source boundary' "$APP/Contents/Resources/vEGPURoot/legal/generated/NOTICES"
          grep -F 'vEGPU uses a stricter form of the UTM / UTM-QEMU-style architecture' "$APP/Contents/Resources/vEGPURoot/legal/generated/NOTICES"
          grep -F 'The app-side LICENSES file consolidates the full verbatim app-side license and notice text' "$APP/Contents/Resources/vEGPURoot/legal/generated/NOTICES"
          grep -F 'Machine/QEMU license text is not copied into this vEGPU.app LICENSES file' "$APP/Contents/Resources/vEGPURoot/legal/generated/LICENSES"
          if grep -E 'archives scanned|license/notice files harvested|license/notice files collected|Included License/Notice Files|Swift Package Pins|Go Modules|Bundle identifier' "$APP/Contents/Resources/vEGPURoot/legal/generated/NOTICES"; then
            echo "vEGPU.app NOTICES must be user-facing packaging/legal prose, not a raw generated audit inventory" >&2
            exit 1
          fi
          if grep -E '^- vEGPU Machine .*[(]missing[)]' "$APP/Contents/Resources/vEGPURoot/legal/generated/NOTICES"; then
            echo "vEGPU.app NOTICES must not describe external Machine legal paths with build-time missing status" >&2
            exit 1
          fi
          grep -F 'Package/Dependency: ANGLE' "$APP/Contents/Resources/vEGPURoot/legal/generated/LICENSES"
          grep -F 'Package/Dependency: vEGPU.app' "$APP/Contents/Resources/vEGPURoot/legal/generated/LICENSES"
          grep -F 'Package/Dependency: Display runtime: glib' "$APP/Contents/Resources/vEGPURoot/legal/generated/LICENSES"
          grep -F 'Package/Dependency: Display runtime: openssl' "$APP/Contents/Resources/vEGPURoot/legal/generated/LICENSES"
          grep -F 'Package/Dependency: Display runtime: gstreamer' "$APP/Contents/Resources/vEGPURoot/legal/generated/LICENSES"
          grep -F 'Package/Dependency: Bundled llama.cpp runtime' "$APP/Contents/Resources/vEGPURoot/legal/generated/LICENSES"
          if [ "$(grep -c '^Package/Dependency:' "$APP/Contents/Resources/vEGPURoot/legal/generated/LICENSES")" -lt 40 ]; then
            echo "vEGPU.app LICENSES is missing harvested bundled dependency license blocks" >&2
            exit 1
          fi
          if grep -F 'Package/Dependency: QEMU' "$APP/Contents/Resources/vEGPURoot/legal/generated/LICENSES"; then
            echo "vEGPU.app LICENSES must reference Machine/QEMU notices but not duplicate QEMU license blocks" >&2
            exit 1
          fi
          APP_EXECUTABLE="$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          APP_STRINGS="$RUNNER_TEMP/vegpu-app-strings.txt"
          strings "$APP/Contents/MacOS/$APP_EXECUTABLE" > "$APP_STRINGS"
          require_app_string_or_source() {
            needle="$1"
            if ! grep -F "$needle" "$APP_STRINGS" >/dev/null && ! grep -R -F "$needle" Sources/vEGPUApp >/dev/null; then
              echo "vEGPU.app is missing expected Help/legal string in built strings and source: $needle" >&2
              exit 1
            fi
          }
          require_app_string_or_source 'vEGPU Help'
          require_app_string_or_source 'vEGPU Machine Notices'
          require_app_string_or_source 'vEGPU Machine Licenses'
          require_app_string_or_source 'EXTERNAL'

      - name: Pack vEGPU.app artifact
        run: |
          mkdir -p "$RUNNER_TEMP/vegpu-artifacts/app-archive"
          tar -czf "$RUNNER_TEMP/vegpu-artifacts/app-archive/vEGPU-app.tar.gz" \
            -C "$RUNNER_TEMP/vegpu-artifacts/app" \
            vEGPU.app
          tar -tzf "$RUNNER_TEMP/vegpu-artifacts/app-archive/vEGPU-app.tar.gz" | grep -F 'vEGPU.app/Contents/MacOS/vEGPUApp'

      - name: Upload vEGPU.app archive
        uses: actions/upload-artifact@v7
        with:
          name: vEGPU-app
          path: ${{ runner.temp }}/vegpu-artifacts/app-archive/vEGPU-app.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Upload generated vEGPU notices and source
        uses: actions/upload-artifact@v7
        with:
          name: vEGPU-legal-generated
          path: ${{ runner.temp }}/vegpu-artifacts/legal/generated
          if-no-files-found: error
          retention-days: 90

  machine-artifacts:
    name: Build/fetch vEGPU Machine and DKMS guest tools
    runs-on: macos-26
    needs:
      - machine-build
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && (inputs.build_scope || 'package') == 'package') || startsWith(github.ref, 'refs/tags/')) && ((github.event_name == 'workflow_dispatch' && (inputs.machine_mode || 'app-run') || 'app-run') == 'app-run' || (github.event_name == 'workflow_dispatch' && (inputs.machine_mode || 'app-run') || 'app-run') == 'download-run' || needs.machine-build.result == 'success') }}
    env:
      MACHINE_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.machine_mode || 'app-run') || 'app-run' }}
      MACHINE_APP_RUN_ID: ${{ inputs.machine_app_run_id || vars.VEGPU_MACHINE_APP_RUN_ID || '' }}
      MACHINE_RUN_ID: ${{ inputs.machine_run_id || '' }}

    steps:
      - name: Check out vEGPU
        uses: actions/checkout@v6

      - name: Validate Machine mode
        run: |
          case "${MACHINE_MODE}" in
            app-run|download-run|trigger) ;;
            *)
              echo "machine_mode must be app-run, download-run, or trigger" >&2
              exit 1
              ;;
          esac

      - name: Resolve latest Machine artifact run
        if: ${{ env.MACHINE_MODE == 'app-run' && env.MACHINE_APP_RUN_ID == '' }}
        run: |
          pages="$RUNNER_TEMP/vegpu-actions-artifacts.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > "$pages"
          run_id="$(python3 scripts/resolve-artifact-run.py "$pages" vEGPU-machine-artifacts)"
          test -n "$run_id"
          echo "MACHINE_APP_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "Resolved Machine artifact from vEGPU run $run_id"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Require Machine artifact source
        run: |
          if [ "${MACHINE_MODE}" = "app-run" ] && [ -z "${MACHINE_APP_RUN_ID}" ]; then
            echo "machine_mode=app-run requires machine_app_run_id" >&2
            exit 1
          fi
          if [ "${MACHINE_MODE}" = "download-run" ] && [ -z "${MACHINE_RUN_ID}" ]; then
            echo "machine_mode=download-run requires machine_run_id" >&2
            exit 1
          fi

      - name: Download Machine artifacts from prior vEGPU workflow run
        if: ${{ env.MACHINE_MODE == 'app-run' }}
        run: |
          mkdir -p "$RUNNER_TEMP/vegpu-input/machine-app-run"
          gh run download "$MACHINE_APP_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name vEGPU-machine-artifacts \
            --dir "$RUNNER_TEMP/vegpu-input/machine-app-run"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download Machine artifacts from reusable workflow
        if: ${{ env.MACHINE_MODE == 'trigger' }}
        uses: actions/download-artifact@v8
        with:
          pattern: vEGPU-Machine-*-build-output
          path: ${{ runner.temp }}/vegpu-input/machine-reusable
          merge-multiple: true

      - name: Normalize Machine artifacts
        run: |
          if [ "${MACHINE_MODE}" = "app-run" ]; then
            export VEGPU_MACHINE_ARTIFACT_DIR="$RUNNER_TEMP/vegpu-input/machine-app-run"
          elif [ "${MACHINE_MODE}" = "trigger" ]; then
            export VEGPU_MACHINE_ARTIFACT_DIR="$RUNNER_TEMP/vegpu-input/machine-reusable"
          fi
          scripts/fetch-machine-artifacts.sh "$RUNNER_TEMP/vegpu-artifacts/machine"
        env:
          GH_TOKEN: ${{ secrets.VEGPU_MACHINE_TOKEN || github.token }}
          VEGPU_MACHINE_REPOSITORY: ${{ inputs.machine_repository || 'openresearchtools/vEGPU-machine' }}
          VEGPU_MACHINE_REF: ${{ inputs.machine_ref || 'main' }}
          VEGPU_MACHINE_RUN_ID: ${{ env.MACHINE_MODE == 'download-run' && inputs.machine_run_id || '' }}
          VEGPU_TRIGGER_MACHINE_BUILD: "0"
          VEGPU_REQUIRE_MACHINE_SOURCE: "1"
          VEGPU_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          VEGPU_BUILD_NUMBER: ${{ env.BUILD_NUMBER }}

      - name: Validate Machine app payload
        run: |
          APP="$RUNNER_TEMP/vegpu-artifacts/machine/vEGPU Machine.app"
          test -d "$APP"
          test -x "$APP/Contents/MacOS/vEGPU Machine"
          test -x "$APP/Contents/MacOS/qemu-vfio-apple"
          test -f "$APP/Contents/Resources/ThirdPartyNotices/NOTICES"
          test -f "$APP/Contents/Resources/ThirdPartyNotices/LICENSES"
          test -f "$APP/Contents/Resources/guest-tools/manifest.json"
          test -d "$APP/Contents/Resources/guest-tools/source"
          find "$APP/Contents/Resources/guest-tools/packages" -type f \( -name 'apple-dma-dkms_*.deb' -o -name 'vegpu-guest-dma-dkms_*.deb' \) -print -quit | grep -q .
          if find "$APP/Contents/Resources/guest-tools/packages" -type f \( -name 'apple-dma-modules-*.deb' -o -name 'vegpu-guest-dma-modules-*.deb' \) -print -quit | grep -q .; then
            echo "Machine guest tools must not contain kernel-versioned DMA module packages" >&2
            exit 1
          fi
          find "$APP/Contents/Resources/guest-tools/source" -type f -name 'apple-dma-*.tar.gz' -print -quit | grep -q .
          find "$RUNNER_TEMP/vegpu-artifacts/machine" -maxdepth 1 -type f -name 'vEGPU-Machine-*-source.tar.gz' -print -quit | grep -q .
          if find "$RUNNER_TEMP/vegpu-artifacts/machine" -path '*/downloaded/*' -print -quit | grep -q .; then
            echo "Machine artifact must not recursively upload downloaded artifact scratch directories" >&2
            exit 1
          fi
          codesign --verify --deep --strict "$APP"

      - name: Upload Machine artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vEGPU-machine-artifacts
          path: ${{ runner.temp }}/vegpu-artifacts/machine
          if-no-files-found: error
          retention-days: 90

  machine-build:
    name: Build vEGPU Machine
    if: ${{ ((github.event_name == 'workflow_dispatch' && (inputs.build_scope || 'package') == 'package') || startsWith(github.ref, 'refs/tags/')) && (github.event_name == 'workflow_dispatch' && (inputs.machine_mode || 'app-run') || 'app-run') == 'trigger' }}
    uses: openresearchtools/vEGPU-machine/.github/workflows/build-nosip.yml@main
    permissions:
      contents: write
    secrets: inherit
    with:
      release_version: ${{ inputs.release_version || '0.1.0' }}
      build_number: ${{ inputs.build_number || github.run_number }}
      publish_release: false
      prerelease: true

  package:
    name: Package installer
    runs-on: macos-26
    needs:
      - build-app
      - machine-artifacts
    if: ${{ always() && needs.build-app.result == 'success' && needs.machine-artifacts.result == 'success' }}

    steps:
      - name: Check out vEGPU
        uses: actions/checkout@v6

      - name: Download vEGPU.app
        uses: actions/download-artifact@v8
        with:
          name: vEGPU-app
          path: ${{ runner.temp }}/vegpu-input/app-archive

      - name: Unpack vEGPU.app
        run: |
          mkdir -p "$RUNNER_TEMP/vegpu-input/app"
          tar -xzf "$RUNNER_TEMP/vegpu-input/app-archive/vEGPU-app.tar.gz" \
            -C "$RUNNER_TEMP/vegpu-input/app"
          codesign --verify --deep --strict "$RUNNER_TEMP/vegpu-input/app/vEGPU.app"

      - name: Download vEGPU legal payload
        uses: actions/download-artifact@v8
        with:
          name: vEGPU-legal-generated
          path: ${{ runner.temp }}/vegpu-input/legal

      - name: Download Machine artifacts
        uses: actions/download-artifact@v8
        with:
          name: vEGPU-machine-artifacts
          path: ${{ runner.temp }}/vegpu-input/machine

      - name: Rehydrate Machine app from archive
        run: |
          rm -rf "$RUNNER_TEMP/vegpu-input/machine-rehydrated"
          VEGPU_MACHINE_ARTIFACT_DIR="$RUNNER_TEMP/vegpu-input/machine" \
          VEGPU_REQUIRE_MACHINE_SOURCE=1 \
          scripts/fetch-machine-artifacts.sh "$RUNNER_TEMP/vegpu-input/machine-rehydrated"
          rm -rf "$RUNNER_TEMP/vegpu-input/machine"
          mv "$RUNNER_TEMP/vegpu-input/machine-rehydrated" "$RUNNER_TEMP/vegpu-input/machine"
          codesign --verify --deep --strict "$RUNNER_TEMP/vegpu-input/machine/vEGPU Machine.app"
          codesign -d --entitlements :- "$RUNNER_TEMP/vegpu-input/machine/vEGPU Machine.app" 2>/dev/null | grep -F 'com.apple.developer.system-extension.install'

      - name: Build pkg
        run: |
          VERSION="${RELEASE_VERSION}"
          case "${BUILD_MODE}" in
            pre-release)
              PACKAGE_CHANNEL="pre-release"
              PKG_NAME="vEGPU-v${VERSION}-pre-release.pkg"
              ;;
            full-release)
              PACKAGE_CHANNEL="release"
              PKG_NAME="vEGPU-v${VERSION}.pkg"
              ;;
            *)
              if [ "${PUBLISH_RELEASE}" = "true" ]; then
                if [ "${PRERELEASE_INPUT}" = "true" ]; then
                  PACKAGE_CHANNEL="pre-release"
                  PKG_NAME="vEGPU-v${VERSION}-pre-release.pkg"
                else
                  PACKAGE_CHANNEL="release"
                  PKG_NAME="vEGPU-v${VERSION}.pkg"
                fi
              else
                PACKAGE_CHANNEL="artifact"
                PKG_NAME="vEGPU-v${VERSION}-artifact.pkg"
              fi
              ;;
          esac
          OUT="$RUNNER_TEMP/vegpu-artifacts/pkg/$PKG_NAME"
          mkdir -p "$(dirname "$OUT")" "$RUNNER_TEMP/vegpu-check"
          export VEGPU_MACHINE_APP="$RUNNER_TEMP/vegpu-input/machine/vEGPU Machine.app"
          export VEGPU_REQUIRE_MACHINE_APP=1
          export VEGPU_REQUIRE_MACHINE_SOURCE=1
          VEGPU_APP="$RUNNER_TEMP/vegpu-input/app/vEGPU.app" \
          VEGPU_PKG_BUILD_DIR="$RUNNER_TEMP/vegpu-build/pkg" \
          VEGPU_PACKAGE_CHANNEL="$PACKAGE_CHANNEL" \
          VERSION="$VERSION" \
          OUT="$OUT" \
          scripts/build-release-pkg.sh
          test -f "$OUT"
          pkgutil --expand "$OUT" "$RUNNER_TEMP/vegpu-check/pkg-expanded"
          test -f "$RUNNER_TEMP/vegpu-check/pkg-expanded/Distribution"
          grep -R -F 'For convenience, vEGPU.app Help can render external vEGPU Machine notices and licenses' "$RUNNER_TEMP/vegpu-check/pkg-expanded"
          grep -R -F 'The Help menu marks those Machine-owned rows as EXTERNAL' "$RUNNER_TEMP/vegpu-check/pkg-expanded"
          grep -R -F 'vEGPU uses a stricter form of the UTM / UTM-QEMU-style' "$RUNNER_TEMP/vegpu-check/pkg-expanded"
          grep -R -F 'The installed license texts are the controlling terms' "$RUNNER_TEMP/vegpu-check/pkg-expanded"
          grep -R -F '/Library/SystemExtensions' "$RUNNER_TEMP/vegpu-check/pkg-expanded/Distribution"
          grep -R -F 'driverStatusKnownMissing()' "$RUNNER_TEMP/vegpu-check/pkg-expanded/Distribution"
          grep -R -F 'driverStatusUnknown()' "$RUNNER_TEMP/vegpu-check/pkg-expanded/Distribution"
          grep -R -F 'start_selected="driverNeedsRefresh()"' "$RUNNER_TEMP/vegpu-check/pkg-expanded/Distribution"
        env:
          BUILD_MODE: ${{ inputs.mode || 'artifact-only' }}
          PUBLISH_RELEASE: ${{ inputs.publish_release || 'false' }}
          PRERELEASE_INPUT: ${{ inputs.prerelease || 'true' }}

      - name: Gather package assets
        run: |
          VERSION="${RELEASE_VERSION}"
          ASSETS="$RUNNER_TEMP/vegpu-artifacts/release-assets"
          mkdir -p "$ASSETS"
          pkg="$(find "$RUNNER_TEMP/vegpu-artifacts/pkg" -maxdepth 1 -type f -name 'vEGPU-v*.pkg' -print -quit)"
          test -n "$pkg"
          cp "$pkg" "$ASSETS/"
          test "$(find "$ASSETS" -maxdepth 1 -type f -name 'vEGPU-v*.pkg' | wc -l | tr -d ' ')" = "1"
          find "$ASSETS" -maxdepth 1 -type f -print | sort

      - name: Upload package assets
        uses: actions/upload-artifact@v7
        with:
          name: vEGPU-package-assets
          path: ${{ runner.temp }}/vegpu-artifacts/release-assets
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: ${{ inputs.publish_release == true || inputs.mode == 'pre-release' || inputs.mode == 'full-release' || startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_MODE: ${{ inputs.mode || 'artifact-only' }}
          PRERELEASE_INPUT: ${{ inputs.prerelease || 'true' }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          VERSION="${RELEASE_VERSION}"
          case "${BUILD_MODE}" in
            pre-release)
              TAG="v${VERSION}-pre-release"
              TITLE="vEGPU ${VERSION} Pre-release"
              PRERELEASE="true"
              ;;
            full-release)
              TAG="v${VERSION}"
              TITLE="vEGPU ${VERSION}"
              PRERELEASE="false"
              ;;
            *)
              if [ "$IS_TAG" = "true" ]; then
                TAG="v${VERSION}"
                TITLE="vEGPU ${VERSION}"
                PRERELEASE="false"
              elif [ "$PRERELEASE_INPUT" = "true" ]; then
                TAG="v${VERSION}-pre-release"
                TITLE="vEGPU ${VERSION} Pre-release"
                PRERELEASE="true"
              else
                TAG="v${VERSION}"
                TITLE="vEGPU ${VERSION}"
                PRERELEASE="false"
              fi
              ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id)"
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f "name=${TITLE}" \
              -F "prerelease=${PRERELEASE}" \
              >/dev/null
          else
            args=(--title "$TITLE" --notes "vEGPU ${VERSION}")
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" --target "$GITHUB_SHA" "${args[@]}"
          fi
          pkg="$(find "$RUNNER_TEMP/vegpu-artifacts/release-assets" -maxdepth 1 -type f -name 'vEGPU-v*.pkg' -print -quit)"
          test -n "$pkg"
          gh release upload "$TAG" "$pkg" --clobber

      - name: Update release update manifest
        if: ${{ inputs.mode == 'pre-release' || inputs.mode == 'full-release' || startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_MODE: ${{ inputs.mode || 'artifact-only' }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          case "${BUILD_MODE}" in
            pre-release)
              CHANNEL="pre-release"
              MANIFEST="releases/pre-releases-manifest.json"
              TAG="v${VERSION}-pre-release"
              PRERELEASE="true"
              ;;
            full-release)
              CHANNEL="stable"
              MANIFEST="releases/releases-manifest.json"
              TAG="v${VERSION}"
              PRERELEASE="false"
              ;;
            *)
              if [ "$IS_TAG" != "true" ]; then
                echo "Artifact-only builds do not update release manifests."
                exit 0
              fi
              CHANNEL="stable"
              MANIFEST="releases/releases-manifest.json"
              TAG="v${VERSION}"
              PRERELEASE="false"
              ;;
          esac
          pkg="$(find "$RUNNER_TEMP/vegpu-artifacts/release-assets" -maxdepth 1 -type f -name 'vEGPU-v*.pkg' -print -quit)"
          test -n "$pkg"
          PKG_NAME="$(basename "$pkg")"
          PKG_SIZE="$(stat -f%z "$pkg" 2>/dev/null || stat -c%s "$pkg")"
          PKG_SHA256="$(shasum -a 256 "$pkg" | awk '{print $1}')"
          RELEASE_PAGE="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          PACKAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${PKG_NAME}"
          PUBLISHED_AT="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .published_at)"
          export CHANNEL TAG PRERELEASE PKG_NAME PKG_SIZE PKG_SHA256 RELEASE_PAGE PACKAGE_URL PUBLISHED_AT

          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p releases
          if [ ! -f "$MANIFEST" ]; then
            printf '{"schemaVersion":1,"channel":"%s","updatedAt":"","latest":null,"items":[]}\n' "$CHANNEL" > "$MANIFEST"
          fi
          python3 - "$MANIFEST" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          manifest_path = Path(sys.argv[1])
          data = json.loads(manifest_path.read_text())
          entry = {
              "version": os.environ["RELEASE_VERSION"],
              "build": os.environ["BUILD_NUMBER"],
              "tag": os.environ["TAG"],
              "name": os.environ["TAG"],
              "prerelease": os.environ["PRERELEASE"].lower() == "true",
              "publishedAt": os.environ.get("PUBLISHED_AT", ""),
              "releasePageURL": os.environ["RELEASE_PAGE"],
              "packageURL": os.environ["PACKAGE_URL"],
              "packageName": os.environ["PKG_NAME"],
              "packageSize": int(os.environ["PKG_SIZE"]),
              "packageSHA256": os.environ["PKG_SHA256"],
              "minimumMacOS": "14.0",
          }
          items = [item for item in data.get("items", []) if item.get("tag") != entry["tag"]]
          items.insert(0, entry)
          data = {
              "schemaVersion": 1,
              "channel": os.environ["CHANNEL"],
              "updatedAt": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "latest": entry,
              "items": items[:20],
          }
          manifest_path.write_text(json.dumps(data, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- "$MANIFEST"; then
            echo "Release manifest already current."
          else
            git add "$MANIFEST"
            git commit -m "Update ${CHANNEL} release manifest for ${TAG}"
            git push origin main
          fi
