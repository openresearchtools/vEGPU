name: Build PEGPU Legacy macOS 13.5 Artifacts
run-name: Legacy macOS 13.5 ARM artifact build (${{ github.ref_name }})

on:
  push:
    branches:
      - codex/legacy-macos-13-artifacts
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Explicit semantic version, for example 0.1.101. Leave empty to auto-increment from the build ledger."
        required: false
        type: string
      build_number:
        description: "Deprecated; public build number follows the semantic version."
        required: false
        type: string
      mode:
        description: "Legacy branch mode. Artifact-only uploads workflow artifacts and never publishes GitHub releases."
        required: true
        default: artifact-only
        type: choice
        options:
          - artifact-only
      build_scope:
        description: "What to build. display-runtime-only is the default legacy path for reusable cached ANGLE/SPICE artifacts."
        required: true
        default: display-runtime-only
        type: choice
        options:
          - package
          - display-runtime-only
      display_mode:
        description: "How this workflow obtains the legacy macOS 13.5 app display runtime. build uses artifact/cache/ccache; app-run reuses a prior legacy run."
        required: true
        default: build
        type: choice
        options:
          - app-run
          - build
      display_artifact_run_id:
        description: "Existing PEGPU workflow run id containing display runtime artifacts when display_mode=app-run."
        required: false
        type: string
      scaling_mode:
        description: "How this workflow obtains the Linux scaling helper package. app-run reuses a prior PEGPU workflow artifact."
        required: true
        default: app-run
        type: choice
        options:
          - app-run
          - build
      scaling_artifact_run_id:
        description: "Existing PEGPU workflow run id containing PEGPU-scaling-package when scaling_mode=app-run."
        required: false
        type: string
      utm_repository:
        description: "UTM fork/repo that supplies the app display dependency recipe."
        required: false
        default: https://github.com/utmapp/UTM.git
        type: string
      utm_commit:
        description: "UTM commit that supplies the app display dependency recipe."
        required: false
        default: e4a4c34b671284263fc69f81b607de494d7e9b65
        type: string
      machine_mode:
        description: "How this workflow obtains PEGPU Machine. This legacy branch reuses pinned artifacts and does not trigger Machine rebuilds."
        required: true
        default: app-run
        type: choice
        options:
          - app-run
          - download-run
      machine_app_run_id:
        description: "Existing PEGPU workflow run id containing PEGPU-machine-artifacts when machine_mode=app-run."
        required: false
        type: string
      machine_repository:
        description: "Machine repo used for download-run."
        required: false
        default: openresearchtools/PEGPU-machine
        type: string
      machine_ref:
        description: "Reserved for manually coordinated Machine artifacts; rebuilds are not triggered by this branch."
        required: false
        default: main
        type: string
      machine_run_id:
        description: "Existing Machine workflow run id when machine_mode=download-run."
        required: false
        type: string
      llama_runtime_tag:
        description: "llama.cpp runtime release tag from openresearchtools/llama-cpp-arm64-builds. Use latest for newest stable."
        required: false
        default: latest
        type: string
      display_partial_run_id:
        description: "Optional PEGPU run id containing PEGPU-display-runtime-partial to resume a failed display build."
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && (inputs.build_scope || 'package') == 'package' && 'package-version-ledger' || github.ref }}
  cancel-in-progress: false

env:
  CONFIGURATION: release
  DISPLAY_SOURCE_REQUIRED: true
  MACOS_ARTIFACT_ABI: legacy-macos13_5-arm64
  MACOS_ARTIFACT_LABEL: legacy-macos13.5-arm64
  MACOS_DEPLOYMENT_TARGET: "13.5"

jobs:
  source-check:
    name: Verify source tree
    runs-on: ubuntu-24.04

    steps:
      - name: Check out PEGPU
        uses: actions/checkout@v6

      - name: Install verifier tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file ripgrep

      - name: Verify no generated/local payloads
        run: scripts/verify-clean-repo.sh

  version:
    name: Resolve PEGPU version
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_scope || 'package') == 'package' }}
    outputs:
      release_version: ${{ steps.resolve.outputs.release_version }}
      build_number: ${{ steps.resolve.outputs.build_number }}

    steps:
      - name: Check out PEGPU
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve semantic version
        id: resolve
        run: python3 scripts/resolve-pegpu-version.py --explicit "${{ inputs.release_version || '' }}"

  display-runtime:
    name: Build legacy macOS 13.5 display runtime from source
    runs-on: macos-14
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    env:
      DISPLAY_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.display_mode || 'build') || 'build' }}
      DISPLAY_ARTIFACT_RUN_ID: ${{ inputs.display_artifact_run_id || vars.PEGPU_DISPLAY_ARTIFACT_RUN_ID || '' }}

    steps:
      - name: Check out PEGPU
        uses: actions/checkout@v6

      - name: Validate display runtime mode
        run: |
          case "${DISPLAY_MODE}" in
            app-run|build) ;;
            *)
              echo "display_mode must be app-run or build" >&2
              exit 1
              ;;
          esac

      - name: Require display runtime artifact run
        if: ${{ env.DISPLAY_MODE == 'app-run' }}
        run: |
          if [ "${DISPLAY_MODE}" = "app-run" ] && [ -z "${DISPLAY_ARTIFACT_RUN_ID}" ]; then
            echo "display_mode=app-run requires display_artifact_run_id" >&2
            exit 1
          fi

      - name: Download display runtime artifacts from prior PEGPU workflow run
        if: ${{ env.DISPLAY_MODE == 'app-run' }}
        run: |
          mkdir -p \
            "$RUNNER_TEMP/pegpu-artifacts/display-frameworks/macos-arm64" \
            "$RUNNER_TEMP/pegpu-artifacts/display-runtime-source"
          gh run download "$DISPLAY_ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "PEGPU-display-frameworks-${MACOS_ARTIFACT_ABI}" \
            --dir "$RUNNER_TEMP/pegpu-artifacts/display-frameworks/macos-arm64"
          gh run download "$DISPLAY_ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "PEGPU-display-runtime-source-${MACOS_ARTIFACT_ABI}" \
            --dir "$RUNNER_TEMP/pegpu-artifacts/display-runtime-source"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Restore display runtime artifact cache
        id: display-runtime-artifact-cache
        if: ${{ env.DISPLAY_MODE == 'build' }}
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/pegpu-artifacts/display-frameworks/macos-arm64
            ${{ runner.temp }}/pegpu-artifacts/display-runtime-source/display-runtime-source.tar.gz
          key: ${{ env.MACOS_ARTIFACT_ABI }}-display-runtime-artifacts-v3-${{ inputs.utm_commit || vars.PEGPU_UTM_COMMIT || 'e4a4c34b671284263fc69f81b607de494d7e9b65' }}-${{ hashFiles('scripts/build-display-runtime-from-source.sh', 'scripts/normalize-display-frameworks.sh', 'third_party/utm/patches/*.patch') }}

      - name: Restore display runtime ccache
        id: display-runtime-ccache
        if: ${{ env.DISPLAY_MODE == 'build' && steps.display-runtime-artifact-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/pegpu-ccache/display-runtime
          key: ${{ env.MACOS_ARTIFACT_ABI }}-display-runtime-ccache-v1-${{ inputs.utm_commit || vars.PEGPU_UTM_COMMIT || 'e4a4c34b671284263fc69f81b607de494d7e9b65' }}-${{ hashFiles('scripts/build-display-runtime-from-source.sh', 'scripts/normalize-display-frameworks.sh', 'third_party/utm/patches/*.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.MACOS_ARTIFACT_ABI }}-display-runtime-ccache-v1-${{ inputs.utm_commit || vars.PEGPU_UTM_COMMIT || 'e4a4c34b671284263fc69f81b607de494d7e9b65' }}-${{ hashFiles('scripts/build-display-runtime-from-source.sh', 'scripts/normalize-display-frameworks.sh', 'third_party/utm/patches/*.patch') }}-
            ${{ env.MACOS_ARTIFACT_ABI }}-display-runtime-ccache-v1-${{ inputs.utm_commit || vars.PEGPU_UTM_COMMIT || 'e4a4c34b671284263fc69f81b607de494d7e9b65' }}-
            ${{ env.MACOS_ARTIFACT_ABI }}-display-runtime-ccache-v1-

      - name: Install display-runtime build requirements
        if: ${{ env.DISPLAY_MODE == 'build' && steps.display-runtime-artifact-cache.outputs.cache-hit != 'true' }}
        run: |
          brew update
          brew install \
            bison \
            pkg-config \
            gettext \
            glib-utils \
            libgpg-error \
            nasm \
            make \
            meson \
            cmake \
            llvm \
            ccache \
            spirv-llvm-translator \
            libxcb \
            libxrandr
          python3 -m pip install --break-system-packages --user \
            six \
            pyparsing \
            pyyaml \
            setuptools \
            distlib \
            mako
          echo "/usr/local/opt/bison/bin:/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"

      - name: Prepare display runtime ccache
        if: ${{ env.DISPLAY_MODE == 'build' && steps.display-runtime-artifact-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size=5G
          ccache --zero-stats || true
          ccache --show-stats || true
        env:
          CCACHE_DIR: ${{ runner.temp }}/pegpu-ccache/display-runtime

      - name: Cache display runtime build directory
        if: ${{ env.DISPLAY_MODE == 'build' && steps.display-runtime-artifact-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/pegpu-build/display-runtime-source-build
          key: ${{ env.MACOS_ARTIFACT_ABI }}-display-runtime-work-v3-${{ inputs.utm_commit || vars.PEGPU_UTM_COMMIT || 'e4a4c34b671284263fc69f81b607de494d7e9b65' }}-${{ hashFiles('scripts/build-display-runtime-from-source.sh', 'scripts/normalize-display-frameworks.sh', 'third_party/utm/patches/*.patch') }}
          restore-keys: |
            ${{ env.MACOS_ARTIFACT_ABI }}-display-runtime-work-v3-${{ inputs.utm_commit || vars.PEGPU_UTM_COMMIT || 'e4a4c34b671284263fc69f81b607de494d7e9b65' }}-
            ${{ env.MACOS_ARTIFACT_ABI }}-display-runtime-work-v3-

      - name: Restore failed display runtime partial artifact
        if: ${{ env.DISPLAY_MODE == 'build' && steps.display-runtime-artifact-cache.outputs.cache-hit != 'true' && inputs.display_partial_run_id != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/pegpu-input/display-runtime-partial"
          gh run download "$DISPLAY_PARTIAL_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name PEGPU-display-runtime-partial \
            --dir "$RUNNER_TEMP/pegpu-input/display-runtime-partial"
          partial="$RUNNER_TEMP/pegpu-input/display-runtime-partial/display-runtime-partial.tar.gz"
          test -f "$partial"
          mkdir -p "$RUNNER_TEMP/pegpu-build"
          tar -xzf "$partial" -C "$RUNNER_TEMP/pegpu-build"
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_PARTIAL_RUN_ID: ${{ inputs.display_partial_run_id }}

      - name: Build app-side display frameworks and source bundle
        id: build-display-runtime
        if: ${{ env.DISPLAY_MODE == 'build' && steps.display-runtime-artifact-cache.outputs.cache-hit != 'true' }}
        run: scripts/build-display-runtime-from-source.sh
        env:
          PEGPU_UTM_REPO: ${{ inputs.utm_repository || vars.PEGPU_UTM_REPO || 'https://github.com/utmapp/UTM.git' }}
          PEGPU_UTM_COMMIT: ${{ inputs.utm_commit || vars.PEGPU_UTM_COMMIT || 'e4a4c34b671284263fc69f81b607de494d7e9b65' }}
          PEGPU_DISPLAY_BUILD_DIR: ${{ runner.temp }}/pegpu-build/display-runtime-source-build
          PEGPU_DISPLAY_FRAMEWORKS_OUT: ${{ runner.temp }}/pegpu-artifacts/display-frameworks/macos-arm64
          PEGPU_DISPLAY_SOURCE_OUT: ${{ runner.temp }}/pegpu-artifacts/display-runtime-source/display-runtime-source.tar.gz
          PEGPU_DISPLAY_ARTIFACT_NAME: PEGPU-display-frameworks-${{ env.MACOS_ARTIFACT_ABI }}
          PEGPU_MACOS_DEPLOYMENT_TARGET: ${{ env.MACOS_DEPLOYMENT_TARGET }}
          MACOSX_DEPLOYMENT_TARGET: ${{ env.MACOS_DEPLOYMENT_TARGET }}
          PEGPU_ENABLE_CCACHE: "1"
          PEGPU_CCACHE_DIR: ${{ runner.temp }}/pegpu-ccache/display-runtime

      - name: Show display runtime ccache stats
        if: ${{ always() && env.DISPLAY_MODE == 'build' && steps.display-runtime-artifact-cache.outputs.cache-hit != 'true' }}
        run: ccache --show-stats || true
        env:
          CCACHE_DIR: ${{ runner.temp }}/pegpu-ccache/display-runtime

      - name: Save display runtime ccache
        if: ${{ always() && env.DISPLAY_MODE == 'build' && steps.display-runtime-artifact-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/pegpu-ccache/display-runtime
          key: ${{ steps.display-runtime-ccache.outputs.cache-primary-key }}

      - name: Pack failed display runtime partial state
        if: ${{ failure() && env.DISPLAY_MODE == 'build' && steps.display-runtime-artifact-cache.outputs.cache-hit != 'true' }}
        run: |
          work="$RUNNER_TEMP/pegpu-build/display-runtime-source-build"
          out="$RUNNER_TEMP/pegpu-artifacts/display-runtime-partial/display-runtime-partial.tar.gz"
          test -d "$work"
          mkdir -p "$(dirname "$out")"
          tar \
            --exclude='*/.git' \
            --exclude='*/.git/*' \
            --exclude='*/DerivedData/*/Index.noindex' \
            --exclude='*/Index.noindex' \
            -czf "$out" \
            -C "$RUNNER_TEMP/pegpu-build" \
            display-runtime-source-build

      - name: Upload failed display runtime partial state
        if: ${{ failure() && env.DISPLAY_MODE == 'build' && steps.display-runtime-artifact-cache.outputs.cache-hit != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: PEGPU-display-runtime-partial
          path: ${{ runner.temp }}/pegpu-artifacts/display-runtime-partial/display-runtime-partial.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Verify display runtime outputs
        run: |
          FRAMEWORKS="$RUNNER_TEMP/pegpu-artifacts/display-frameworks/macos-arm64"
          SOURCE="$RUNNER_TEMP/pegpu-artifacts/display-runtime-source/display-runtime-source.tar.gz"
          test -d "$FRAMEWORKS/spice-client-glib-2.0.8.framework"
          test -d "$FRAMEWORKS/EGL.framework"
          test -d "$FRAMEWORKS/GLESv2.framework"
          if [ "${DISPLAY_MODE}" = "build" ]; then
            scripts/normalize-display-frameworks.sh --check "$FRAMEWORKS"
          fi
          otool -D "$FRAMEWORKS/EGL.framework/Versions/A/EGL" | grep -F '@rpath/EGL.framework/Versions/A/EGL'
          otool -D "$FRAMEWORKS/GLESv2.framework/Versions/A/GLESv2" | grep -F '@rpath/GLESv2.framework/Versions/A/GLESv2'
          python3 - "$MACOS_DEPLOYMENT_TARGET" \
            "$FRAMEWORKS/EGL.framework/Versions/A/EGL" \
            "$FRAMEWORKS/GLESv2.framework/Versions/A/GLESv2" \
            "$FRAMEWORKS/spice-client-glib-2.0.8.framework/Versions/A/spice-client-glib-2.0.8" <<'PY'
          import re
          import subprocess
          import sys

          target_text = sys.argv[1]

          def version_tuple(text):
              parts = [int(part) for part in text.split(".")]
              return tuple(parts + [0] * (3 - len(parts)))

          def deployment_versions(text):
              versions = []
              active = None
              for raw_line in text.splitlines():
                  line = raw_line.strip()
                  if line == "cmd LC_BUILD_VERSION":
                      active = "build"
                      continue
                  if line == "cmd LC_VERSION_MIN_MACOSX":
                      active = "min"
                      continue
                  if line.startswith("cmd "):
                      active = None
                      continue
                  if active == "build":
                      match = re.match(r"minos\s+([0-9]+(?:\.[0-9]+){1,2})$", line)
                  elif active == "min":
                      match = re.match(r"version\s+([0-9]+(?:\.[0-9]+){1,2})$", line)
                  else:
                      match = None
                  if match:
                      versions.append(version_tuple(match.group(1)))
              return versions

          bad = []
          for binary in sys.argv[2:]:
              text = subprocess.check_output(["otool", "-l", binary], text=True)
              versions = deployment_versions(text)
              if not versions:
                  bad.append(f"{binary}: missing min macOS load command")
                  continue
              highest = max(versions)
              if highest > version_tuple(target_text):
                  bad.append(f"{binary}: min macOS {'.'.join(map(str, highest)).rstrip('.0')} exceeds {target_text}")
          if bad:
              raise SystemExit("\n".join(bad))
          PY
          test -f "$SOURCE"
          tar -tzf "$SOURCE" | grep -F 'display-runtime-source/README'
          tar -tzf "$SOURCE" | grep -F 'display-runtime-source/utm-patches/sources'
          tar -tzf "$SOURCE" | grep -F 'display-runtime-source/git-sources/utm-base/utm-base-'
          tar -tzf "$SOURCE" | grep -F 'display-runtime-source/git-sources/WebKit.git/WebKit-source.tar.gz'
          tar -tzf "$SOURCE" | grep -F 'display-runtime-source/git-sources/WebKit.git/HEAD'
          tar -tzf "$SOURCE" | grep -F 'display-runtime-source/git-sources/WebKit.git/REMOTE'
          tar -tzf "$SOURCE" | grep -F 'display-runtime-source/git-sources/libucontext.git/libucontext-source.tar.gz'
          tar -tzf "$SOURCE" | grep -F 'display-runtime-source/git-sources/libepoxy.git/libepoxy-source.tar.gz'
          tar -tzf "$SOURCE" | grep -F 'display-runtime-source/pegpu-utm-patches/0001-openresearchtools-pegpu-cocoaspice-package.patch'
          strings "$FRAMEWORKS/spice-client-glib-2.0.8.framework/Versions/A/spice-client-glib-2.0.8" |
            grep -F 'SPICE_DISABLE_GL_SCANOUT'

      - name: Upload display frameworks
        if: ${{ env.DISPLAY_MODE == 'build' }}
        uses: actions/upload-artifact@v7
        with:
          name: PEGPU-display-frameworks-${{ env.MACOS_ARTIFACT_ABI }}
          path: ${{ runner.temp }}/pegpu-artifacts/display-frameworks/macos-arm64
          if-no-files-found: error
          retention-days: 90

      - name: Upload display runtime source bundle
        if: ${{ env.DISPLAY_MODE == 'build' }}
        uses: actions/upload-artifact@v7
        with:
          name: PEGPU-display-runtime-source-${{ env.MACOS_ARTIFACT_ABI }}
          path: ${{ runner.temp }}/pegpu-artifacts/display-runtime-source/display-runtime-source.tar.gz
          if-no-files-found: error
          retention-days: 90

  scaling-package:
    name: Build Linux scaling helper package
    runs-on: ubuntu-24.04
    needs:
      - version
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_scope || 'package') == 'package' }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
      SCALING_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.scaling_mode || 'app-run') || 'app-run' }}
      SCALING_ARTIFACT_RUN_ID: ${{ inputs.scaling_artifact_run_id || vars.PEGPU_SCALING_ARTIFACT_RUN_ID || '' }}

    steps:
      - name: Check out PEGPU
        uses: actions/checkout@v6

      - name: Validate scaling package mode
        run: |
          case "${SCALING_MODE}" in
            app-run|build) ;;
            *)
              echo "scaling_mode must be app-run or build" >&2
              exit 1
              ;;
          esac

      - name: Resolve latest scaling package artifact run
        if: ${{ env.SCALING_MODE == 'app-run' && env.SCALING_ARTIFACT_RUN_ID == '' }}
        run: |
          pages="$RUNNER_TEMP/pegpu-actions-artifacts.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > "$pages"
          run_id="$(python3 scripts/resolve-artifact-run.py "$pages" PEGPU-scaling-package)"
          test -n "$run_id"
          echo "SCALING_ARTIFACT_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "Resolved scaling package artifact from PEGPU run $run_id"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Require scaling package artifact run
        if: ${{ env.SCALING_MODE == 'app-run' }}
        run: |
          if [ "${SCALING_MODE}" = "app-run" ] && [ -z "${SCALING_ARTIFACT_RUN_ID}" ]; then
            echo "scaling_mode=app-run requires scaling_artifact_run_id" >&2
            exit 1
          fi

      - name: Download scaling package from prior PEGPU workflow run
        if: ${{ env.SCALING_MODE == 'app-run' }}
        run: |
          mkdir -p "$RUNNER_TEMP/pegpu-artifacts/scaling-package"
          gh run download "$SCALING_ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name PEGPU-scaling-package \
            --dir "$RUNNER_TEMP/pegpu-artifacts/scaling-package"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Restore scaling package cache
        id: scaling-package-cache
        if: ${{ env.SCALING_MODE == 'build' }}
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/pegpu-artifacts/scaling-package
          key: ${{ runner.os }}-scaling-package-v3-${{ needs.version.outputs.release_version }}-${{ hashFiles('scripts/build-scaling-app-package.sh', 'Resources/Guest/scaling-app/**') }}

      - name: Build Debian package in disposable Debian
        if: ${{ env.SCALING_MODE == 'build' && steps.scaling-package-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/pegpu-artifacts/scaling-package" "$RUNNER_TEMP/pegpu-build/scaling-app-deb"
          docker run --rm \
            -e RELEASE_VERSION="$RELEASE_VERSION" \
            -v "$PWD:/workspace:ro" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace \
            debian:trixie-slim \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates coreutils dpkg-dev findutils
              PEGPU_SCALING_ARCH=arm64 \
              PEGPU_SCALING_VERSION="${RELEASE_VERSION}" \
              PEGPU_SCALING_PACKAGE_OUT=/runner-temp/pegpu-artifacts/scaling-package \
              PEGPU_SCALING_BUILD_DIR=/runner-temp/pegpu-build/scaling-app-deb \
              scripts/build-scaling-app-package.sh
            '

      - name: Validate Debian package
        run: |
          OUT="$RUNNER_TEMP/pegpu-artifacts/scaling-package"
          test -f "$OUT/SHA512SUMS"
          package="$(find "$OUT" -maxdepth 1 -type f -name 'pegpu-scaling_*.deb' -print -quit)"
          test -n "$package"
          (cd "$OUT" && sha512sum -c SHA512SUMS)
          if [ "${SCALING_MODE}" = "build" ]; then
            test "$(dpkg-deb -f "$package" Version)" = "${RELEASE_VERSION}"
          fi
          dpkg-deb -c "$package" | grep -F './usr/share/doc/pegpu-scaling/copyright'

      - name: Upload scaling package
        uses: actions/upload-artifact@v7
        with:
          name: PEGPU-scaling-package
          path: ${{ runner.temp }}/pegpu-artifacts/scaling-package
          if-no-files-found: error
          retention-days: 90

      - name: Upload versioned scaling package
        if: ${{ env.SCALING_MODE == 'build' }}
        uses: actions/upload-artifact@v7
        with:
          name: PEGPU-scaling-package-v${{ needs.version.outputs.release_version }}
          path: ${{ runner.temp }}/pegpu-artifacts/scaling-package
          if-no-files-found: error
          retention-days: 90

  performance-package:
    name: Build Linux performance helper package
    runs-on: ubuntu-24.04
    needs:
      - version
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_scope || 'package') == 'package' }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.release_version }}

    steps:
      - name: Check out PEGPU
        uses: actions/checkout@v6

      - name: Build Debian package in disposable Debian
        run: |
          mkdir -p "$RUNNER_TEMP/pegpu-artifacts/performance-package" "$RUNNER_TEMP/pegpu-build/performance-app-deb"
          docker run --rm \
            -e RELEASE_VERSION="$RELEASE_VERSION" \
            -v "$PWD:/workspace:ro" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace \
            debian:trixie-slim \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates coreutils dpkg-dev findutils
              PEGPU_PERFORMANCE_ARCH=arm64 \
              PEGPU_PERFORMANCE_VERSION="${RELEASE_VERSION}" \
              PEGPU_PERFORMANCE_PACKAGE_OUT=/runner-temp/pegpu-artifacts/performance-package \
              PEGPU_PERFORMANCE_BUILD_DIR=/runner-temp/pegpu-build/performance-app-deb \
              scripts/build-performance-app-package.sh
            '

      - name: Validate Debian package
        run: |
          OUT="$RUNNER_TEMP/pegpu-artifacts/performance-package"
          test -f "$OUT/SHA512SUMS"
          package="$(find "$OUT" -maxdepth 1 -type f -name 'pegpu-performance_*.deb' -print -quit)"
          test -n "$package"
          (cd "$OUT" && sha512sum -c SHA512SUMS)
          test "$(dpkg-deb -f "$package" Version)" = "${RELEASE_VERSION}"
          dpkg-deb -c "$package" | grep -F './usr/bin/pegpu-performance'
          dpkg-deb -c "$package" | grep -F './etc/sudoers.d/90-pegpu-performance'
          dpkg-deb -c "$package" | grep -F './usr/share/applications/pegpu-performance.desktop'
          dpkg-deb -c "$package" | grep -F './usr/share/icons/hicolor/512x512/apps/pegpu-performance.png'

      - name: Upload performance package
        uses: actions/upload-artifact@v7
        with:
          name: PEGPU-performance-package
          path: ${{ runner.temp }}/pegpu-artifacts/performance-package
          if-no-files-found: error
          retention-days: 90

      - name: Upload versioned performance package
        uses: actions/upload-artifact@v7
        with:
          name: PEGPU-performance-package-v${{ needs.version.outputs.release_version }}
          path: ${{ runner.temp }}/pegpu-artifacts/performance-package
          if-no-files-found: error
          retention-days: 90

  llama-runtime:
    name: Fetch bundled llama.cpp runtime
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_scope || 'package') == 'package' }}
    outputs:
      cache_key: ${{ steps.resolve.outputs.cache_key }}
    env:
      LLAMA_RUNTIME_TAG: ${{ inputs.llama_runtime_tag || 'latest' }}

    steps:
      - name: Check out PEGPU
        uses: actions/checkout@v6

      - name: Resolve and download llama.cpp runtime assets
        id: resolve
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pegpu-artifacts/llama-runtime/archives"
          gh api "repos/openresearchtools/llama-cpp-arm64-builds/releases?per_page=100" > "$RUNNER_TEMP/llama-releases.json"
          python3 - "$RUNNER_TEMP/llama-releases.json" "$RUNNER_TEMP/pegpu-artifacts/llama-runtime" "$LLAMA_RUNTIME_TAG" <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          releases = json.loads(Path(sys.argv[1]).read_text())
          out = Path(sys.argv[2])
          requested = sys.argv[3].strip()

          def body_field(body, name):
              match = re.search(rf"(?m)^{re.escape(name)}:\s*`([^`]+)`", body or "")
              return match.group(1).strip() if match else ""

          chosen = None
          for item in releases:
              if item.get("draft") or item.get("prerelease"):
                  continue
              source = body_field(item.get("body", ""), "Source")
              if source != "ggml-org/llama.cpp":
                  continue
              if requested.lower() == "latest" or item.get("tag_name") == requested:
                  chosen = item
                  break
          if chosen is None:
              raise SystemExit(f"llama runtime release not found: {requested}")

          assets = {asset["name"]: asset for asset in chosen.get("assets", [])}
          required = {
              "macos": "-bin-macos-arm64.tar.gz",
              "cuda13": "-bin-debian-trixie-cuda13-arm64.tar.gz",
              "vulkan": "-bin-debian-trixie-vulkan-arm64.tar.gz",
          }
          selected = {}
          for key, suffix in required.items():
              matches = [asset for name, asset in assets.items() if name.endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit(f"expected exactly one {suffix} asset, found {len(matches)}")
              selected[key] = matches[0]

          def body_sha(name):
              body = chosen.get("body", "")
              match = re.search(rf"(?im){re.escape(name)}.*?sha256[:=]\s*([a-f0-9]{{64}})", body)
              return match.group(1).lower() if match else ""

          manifest_assets = {}
          for key, asset in selected.items():
              dest = out / "archives" / asset["name"]
              subprocess.run(["curl", "-fL", "--retry", "5", "--retry-delay", "3", "-o", str(dest), asset["browser_download_url"]], check=True)
              actual = hashlib.sha256(dest.read_bytes()).hexdigest()
              expected = body_sha(asset["name"])
              if expected and actual.lower() != expected:
                  raise SystemExit(f"sha256 mismatch for {asset['name']}")
              manifest_assets[key] = {
                  "name": asset["name"],
                  "path": f"archives/{asset['name']}",
                  "size": int(asset.get("size") or dest.stat().st_size),
                  "sha256": actual,
                  "downloadURL": asset["browser_download_url"],
              }

          manifest = {
              "schemaVersion": 1,
              "family": "llama",
              "tag": chosen["tag_name"],
              "name": chosen.get("name") or chosen["tag_name"],
              "publishedAt": chosen.get("published_at") or "",
              "source": "ggml-org/llama.cpp",
              "sourceRef": body_field(chosen.get("body", ""), "Source ref"),
              "assets": manifest_assets,
          }
          (out / "llama-runtime-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          cache_key = "llama-runtime-" + chosen["tag_name"] + "-" + hashlib.sha256(json.dumps(manifest, sort_keys=True).encode()).hexdigest()[:16]
          print(f"cache_key={cache_key}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"cache_key={cache_key}\n")
          PY
          find "$RUNNER_TEMP/pegpu-artifacts/llama-runtime" -maxdepth 2 -type f -print | sort
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload bundled llama.cpp runtime
        uses: actions/upload-artifact@v7
        with:
          name: PEGPU-llama-runtime-bootstrap
          path: ${{ runner.temp }}/pegpu-artifacts/llama-runtime
          if-no-files-found: error
          retention-days: 90

  build-app:
    name: Build PEGPU.app
    runs-on: macos-14
    needs:
      - version
      - display-runtime
      - scaling-package
      - performance-package
      - llama-runtime
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_scope || 'package') == 'package' && needs.version.result == 'success' && needs.display-runtime.result == 'success' && needs.scaling-package.result == 'success' && needs.performance-package.result == 'success' && needs.llama-runtime.result == 'success' }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      DISPLAY_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.display_mode || 'build') || 'build' }}
      DISPLAY_ARTIFACT_RUN_ID: ${{ inputs.display_artifact_run_id || vars.PEGPU_DISPLAY_ARTIFACT_RUN_ID || '' }}

    steps:
      - name: Check out PEGPU
        uses: actions/checkout@v6

      - name: Restore PEGPU.app artifact cache
        id: app-artifact-cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/pegpu-artifacts/app/PEGPU.app
            ${{ runner.temp }}/pegpu-artifacts/legal/generated
          key: ${{ env.MACOS_ARTIFACT_ABI }}-pegpu-app-v5-${{ env.MACOS_DEPLOYMENT_TARGET }}-${{ env.RELEASE_VERSION }}-${{ env.BUILD_NUMBER }}-${{ needs.llama-runtime.outputs.cache_key }}-${{ inputs.utm_commit || vars.PEGPU_UTM_COMMIT || 'e4a4c34b671284263fc69f81b607de494d7e9b65' }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift', 'Resources/**', 'Helpers/**', 'ai/**/*.go', 'ai/**/*.mod', 'ai/**/*.sum', 'ai/**/*.yaml', 'ai/**/*.yml', 'ai/web-ui-app/static/**', 'scripts/build-app-bundle.sh', 'scripts/build-legal-bundle.sh', 'scripts/apply-utm-patches.sh', 'scripts/build-display-runtime-from-source.sh', 'scripts/normalize-display-frameworks.sh', 'scripts/build-scaling-app-package.sh', 'scripts/build-performance-app-package.sh', 'third_party/**', 'legal/**', 'docs/**') }}

      - name: Download display runtime artifacts from prior PEGPU workflow run
        if: ${{ steps.app-artifact-cache.outputs.cache-hit != 'true' && env.DISPLAY_MODE == 'app-run' }}
        run: |
          if [ -z "${DISPLAY_ARTIFACT_RUN_ID}" ]; then
            echo "display_mode=app-run requires display_artifact_run_id" >&2
            exit 1
          fi
          mkdir -p \
            "$RUNNER_TEMP/pegpu-input/display-frameworks/macos-arm64" \
            "$RUNNER_TEMP/pegpu-input/display-runtime-source"
          gh run download "$DISPLAY_ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "PEGPU-display-frameworks-${MACOS_ARTIFACT_ABI}" \
            --dir "$RUNNER_TEMP/pegpu-input/display-frameworks/macos-arm64"
          gh run download "$DISPLAY_ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "PEGPU-display-runtime-source-${MACOS_ARTIFACT_ABI}" \
            --dir "$RUNNER_TEMP/pegpu-input/display-runtime-source"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download source-built display frameworks
        if: ${{ steps.app-artifact-cache.outputs.cache-hit != 'true' && env.DISPLAY_MODE == 'build' }}
        uses: actions/download-artifact@v8
        with:
          name: PEGPU-display-frameworks-${{ env.MACOS_ARTIFACT_ABI }}
          path: ${{ runner.temp }}/pegpu-input/display-frameworks/macos-arm64

      - name: Download display runtime source bundle
        if: ${{ steps.app-artifact-cache.outputs.cache-hit != 'true' && env.DISPLAY_MODE == 'build' }}
        uses: actions/download-artifact@v8
        with:
          name: PEGPU-display-runtime-source-${{ env.MACOS_ARTIFACT_ABI }}
          path: ${{ runner.temp }}/pegpu-input/display-runtime-source

      - name: Download Linux scaling helper package
        if: steps.app-artifact-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: PEGPU-scaling-package
          path: ${{ runner.temp }}/pegpu-input/scaling-package

      - name: Download Linux performance helper package
        if: steps.app-artifact-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: PEGPU-performance-package
          path: ${{ runner.temp }}/pegpu-input/performance-package

      - name: Download bundled llama.cpp runtime
        if: steps.app-artifact-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: PEGPU-llama-runtime-bootstrap
          path: ${{ runner.temp }}/pegpu-input/llama-runtime

      - name: Set up Go
        if: steps.app-artifact-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: ai/web-ui-app/go.mod
          cache-dependency-path: |
            ai/web-ui-app/go.mod
            ai/web-ui-app/go.sum
            ai/gost-local-proxy/go.mod

      - name: Cache SwiftPM build directory
        if: steps.app-artifact-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/pegpu-build/swiftpm-release
          key: ${{ env.MACOS_ARTIFACT_ABI }}-swiftpm-release-v3-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift') }}
          restore-keys: |
            ${{ env.MACOS_ARTIFACT_ABI }}-swiftpm-release-v3-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            ${{ env.MACOS_ARTIFACT_ABI }}-swiftpm-release-v3-

      - name: Cache patched UTM package worktree
        if: steps.app-artifact-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/pegpu-build/utm-patched
          key: ${{ env.MACOS_ARTIFACT_ABI }}-utm-patched-v3-${{ inputs.utm_commit || vars.PEGPU_UTM_COMMIT || 'e4a4c34b671284263fc69f81b607de494d7e9b65' }}-${{ hashFiles('third_party/utm/patches/*.patch', 'scripts/apply-utm-patches.sh') }}

      - name: Build PEGPU.app
        if: steps.app-artifact-cache.outputs.cache-hit != 'true'
        run: |
          export PEGPU_REQUIRE_FULL_SOURCE=1
          CONFIGURATION="${CONFIGURATION}" scripts/build-app-bundle.sh
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          SWIFT_BUILD_SCRATCH_PATH: ${{ runner.temp }}/pegpu-build/swiftpm-release
          PEGPU_APP: ${{ runner.temp }}/pegpu-artifacts/app/PEGPU.app
          PEGPU_APP_BUILD_DIR: ${{ runner.temp }}/pegpu-build/app-build
          PEGPU_DISPLAY_FRAMEWORKS_OUT: ${{ runner.temp }}/pegpu-input/display-frameworks/macos-arm64
          PEGPU_DISPLAY_SOURCE_OUT: ${{ runner.temp }}/pegpu-input/display-runtime-source/display-runtime-source.tar.gz
          PEGPU_LEGAL_BUILD_DIR: ${{ runner.temp }}/pegpu-artifacts/legal/generated
          PEGPU_SCALING_PACKAGE_DIR: ${{ runner.temp }}/pegpu-input/scaling-package
          PEGPU_PERFORMANCE_PACKAGE_DIR: ${{ runner.temp }}/pegpu-input/performance-package
          PEGPU_BOOTSTRAP_LLAMA_RUNTIME_DIR: ${{ runner.temp }}/pegpu-input/llama-runtime
          PEGPU_UTM_PATCHED_WORKTREE: ${{ runner.temp }}/pegpu-build/utm-patched
          PEGPU_MACOS_DEPLOYMENT_TARGET: ${{ env.MACOS_DEPLOYMENT_TARGET }}
          MACOSX_DEPLOYMENT_TARGET: ${{ env.MACOS_DEPLOYMENT_TARGET }}

      - name: Validate app bundle and notices
        run: |
          APP="$RUNNER_TEMP/pegpu-artifacts/app/PEGPU.app"
          codesign --verify --deep --strict "$APP"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "com.pegpu.app"
          test "$(plutil -extract CFBundleDisplayName raw -o - "$APP/Contents/Info.plist")" = "PEGPU"
          test "$(plutil -extract CFBundleName raw -o - "$APP/Contents/Info.plist")" = "PEGPU"
          test "$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")" = "PEGPU"
          test "$(plutil -extract CFBundleIconFile raw -o - "$APP/Contents/Info.plist")" = "PEGPU"
          test "$(plutil -extract LSMinimumSystemVersion raw -o - "$APP/Contents/Info.plist")" = "${MACOS_DEPLOYMENT_TARGET}"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "${RELEASE_VERSION}"
          test "$(plutil -extract CFBundleVersion raw -o - "$APP/Contents/Info.plist")" = "${BUILD_NUMBER}"
          python3 - "$MACOS_DEPLOYMENT_TARGET" "$APP" <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          target_text = sys.argv[1]
          app = Path(sys.argv[2])
          mach_o_magics = {
              b"\xfe\xed\xfa\xce",
              b"\xfe\xed\xfa\xcf",
              b"\xce\xfa\xed\xfe",
              b"\xcf\xfa\xed\xfe",
              b"\xca\xfe\xba\xbe",
              b"\xbe\xba\xfe\xca",
              b"\xca\xfe\xd0\x0d",
          }

          def version_tuple(text):
              parts = [int(part) for part in text.split(".")]
              return tuple(parts + [0] * (3 - len(parts)))

          def deployment_versions(text):
              versions = []
              active = None
              for raw_line in text.splitlines():
                  line = raw_line.strip()
                  if line == "cmd LC_BUILD_VERSION":
                      active = "build"
                      continue
                  if line == "cmd LC_VERSION_MIN_MACOSX":
                      active = "min"
                      continue
                  if line.startswith("cmd "):
                      active = None
                      continue
                  if active == "build":
                      match = re.match(r"minos\s+([0-9]+(?:\.[0-9]+){1,2})$", line)
                  elif active == "min":
                      match = re.match(r"version\s+([0-9]+(?:\.[0-9]+){1,2})$", line)
                  else:
                      match = None
                  if match:
                      versions.append(version_tuple(match.group(1)))
              return versions

          bad = []
          checked = 0
          for path in sorted(item for item in app.rglob("*") if item.is_file()):
              try:
                  with path.open("rb") as handle:
                      if handle.read(4) not in mach_o_magics:
                          continue
              except OSError:
                  continue
              checked += 1
              text = subprocess.check_output(["otool", "-l", str(path)], text=True)
              versions = deployment_versions(text)
              if not versions:
                  bad.append(f"{path}: missing min macOS load command")
                  continue
              highest = max(versions)
              if highest > version_tuple(target_text):
                  bad.append(f"{path}: min macOS {'.'.join(map(str, highest)).rstrip('.0')} exceeds {target_text}")
          if checked == 0:
              bad.append(f"{app}: no Mach-O files found")
          if bad:
              raise SystemExit("\n".join(bad))
          PY
          test -x "$APP/Contents/MacOS/PEGPU"
          test ! -e "$APP/Contents/MacOS/PEGPUApp"
          test -f "$APP/Contents/Resources/PEGPU.icns"
          plutil -extract NSLocalNetworkUsageDescription raw -o - "$APP/Contents/Info.plist" | grep -q 'SSH control'
          plutil -extract NSBonjourServices xml1 -o - "$APP/Contents/Info.plist" | grep -q '_pegpu-preflight._tcp'
          plutil -extract NSBonjourServices xml1 -o - "$APP/Contents/Info.plist" | grep -q '_ssh._tcp'
          plutil -extract NSBonjourServices xml1 -o - "$APP/Contents/Info.plist" | grep -q '_http._tcp'
          test -f "$APP/Contents/Resources/PEGPURoot/legal/generated/NOTICES"
          test -f "$APP/Contents/Resources/PEGPURoot/legal/generated/NOTICES.md"
          test -f "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          test -f "$APP/Contents/Resources/PEGPURoot/legal/generated/manifest.json"
          test -f "$APP/Contents/Resources/PEGPURoot/legal/generated/license-files/ANGLE-LICENSE.txt"
          test -f "$APP/Contents/Resources/PEGPURoot/legal/generated/license-files/ANGLE-SOURCE.md"
          test -f "$APP/Contents/Resources/PEGPURoot/legal/generated/license-files/ANGLE-IMPORT.txt"
          test -d "$APP/Contents/Resources/PEGPURoot/legal/generated/license-files/display-runtime"
          test -d "$APP/Contents/Resources/PEGPURoot/legal/generated/license-files/llama-runtime"
          find "$APP/Contents/Resources/PEGPURoot/legal/generated/license-files/swiftpm" -type f -iname 'LICENSE*' | grep -Ei '/swiftterm/'
          find "$APP/Contents/Resources/PEGPURoot/legal/generated/license-files/swiftpm" -type f -iname 'LICENSE*' | grep -Ei '/swift-argument-parser/'
          scripts/normalize-display-frameworks.sh --check "$APP/Contents/Frameworks"
          for framework in \
            asprintf.0 \
            charset.1 \
            gettextlib-0.22.5 \
            gettextpo.0 \
            gettextsrc-0.22.5 \
            girepository-2.0.0 \
            gstcheck-1.0.0 \
            gstcontroller-1.0.0 \
            textstyle.0 \
            turbojpeg.0
          do
            if [ -d "$APP/Contents/Frameworks/$framework.framework" ]; then
              echo "unused display build/test/tool framework must not be bundled in PEGPU.app: $framework.framework" >&2
              exit 1
            fi
          done
          otool -D "$APP/Contents/Frameworks/EGL.framework/Versions/A/EGL" | grep -F '@rpath/EGL.framework/Versions/A/EGL'
          otool -D "$APP/Contents/Frameworks/GLESv2.framework/Versions/A/GLESv2" | grep -F '@rpath/GLESv2.framework/Versions/A/GLESv2'
          test -f "$APP/Contents/Resources/PEGPURoot/legal/generated/source/PEGPU-app-source.tar.gz"
          test -f "$APP/Contents/Resources/PEGPURoot/legal/generated/source/display-runtime-source.tar.gz"
          DISPLAY_SOURCE="$APP/Contents/Resources/PEGPURoot/legal/generated/source/display-runtime-source.tar.gz"
          tar -tzf "$DISPLAY_SOURCE" | grep -F 'display-runtime-source/git-sources/WebKit.git/WebKit-source.tar.gz'
          tar -tzf "$DISPLAY_SOURCE" | grep -F 'display-runtime-source/git-sources/libucontext.git/libucontext-source.tar.gz'
          tar -tzf "$DISPLAY_SOURCE" | grep -F 'display-runtime-source/upstream-sources/gettext-0.22.5.tar.gz'
          tar -tzf "$DISPLAY_SOURCE" | grep -F 'display-runtime-source/upstream-sources/pkg-config-0.29.2.tar.gz'
          test -f "$APP/Contents/Resources/PEGPURoot/legal/generated/source/PEGPU-app-source.NOTICES"
          test -f "$APP/Contents/Resources/PEGPURoot/legal/generated/source/PEGPU-app-source.LICENSES"
          test -f "$APP/Contents/Resources/PEGPURoot/legal/generated/source/PEGPU-app-source.manifest.json"
          test -f "$APP/Contents/Resources/PEGPURoot/legal/generated/source/display-runtime-source.NOTICES"
          test -f "$APP/Contents/Resources/PEGPURoot/legal/generated/source/display-runtime-source.LICENSES"
          test -f "$APP/Contents/Resources/PEGPURoot/legal/generated/source/display-runtime-source.manifest.json"
          test -f "$APP/Contents/Resources/PEGPURoot/Resources/Guest/reconcile-llama-runtimes.sh"
          find "$APP/Contents/Resources/PEGPURoot/Resources/Guest/scaling-app/package" -maxdepth 1 -type f -name 'pegpu-scaling_*.deb' -print -quit | grep -q .
          find "$APP/Contents/Resources/PEGPURoot/Resources/Guest/performance-app/package" -maxdepth 1 -type f -name 'pegpu-performance_*.deb' -print -quit | grep -q .
          test -f "$APP/Contents/Resources/PEGPURoot/ai/bootstrap-runtimes/llama/llama-runtime-manifest.json"
          find "$APP/Contents/Resources/PEGPURoot/ai/bootstrap-runtimes/llama/archives" -maxdepth 1 -type f -name '*-bin-macos-arm64.tar.gz' -print -quit | grep -q .
          find "$APP/Contents/Resources/PEGPURoot/ai/bootstrap-runtimes/llama/archives" -maxdepth 1 -type f -name '*-bin-debian-trixie-cuda13-arm64.tar.gz' -print -quit | grep -q .
          find "$APP/Contents/Resources/PEGPURoot/ai/bootstrap-runtimes/llama/archives" -maxdepth 1 -type f -name '*-bin-debian-trixie-vulkan-arm64.tar.gz' -print -quit | grep -q .
          test "$(find "$APP/Contents/Resources/PEGPURoot/legal/generated/license-files/display-runtime" -type f | wc -l | tr -d ' ')" -ge 20
          test "$(find "$APP/Contents/Resources/PEGPURoot/legal/generated/license-files/llama-runtime" -type f | wc -l | tr -d ' ')" -ge 3
          find "$APP/Contents/Resources/PEGPURoot/legal/generated/license-files/display-runtime/upstream-sources" -type f | grep -F '/glib-2.83.0/'
          find "$APP/Contents/Resources/PEGPURoot/legal/generated/license-files/display-runtime/upstream-sources" -type f | grep -F '/openssl-1.1.1b/'
          find "$APP/Contents/Resources/PEGPURoot/legal/generated/license-files/display-runtime/upstream-sources" -type f | grep -F '/gstreamer-1.19.1/'
          python3 - "$APP/Contents/Resources/PEGPURoot/ai/bootstrap-runtimes/llama" "$APP/Contents/Resources/PEGPURoot/legal/generated/license-files/llama-runtime" <<'PY'
          import json
          import sys
          from pathlib import Path

          runtime_root = Path(sys.argv[1])
          license_root = Path(sys.argv[2])
          manifest = json.loads((runtime_root / "llama-runtime-manifest.json").read_text())
          if not str(manifest.get("tag") or "").strip():
              raise SystemExit("llama runtime manifest is missing tag")
          assets = manifest.get("assets")
          if not isinstance(assets, dict):
              raise SystemExit("llama runtime manifest assets missing")
          required = {
              "macos": "-bin-macos-arm64.tar.gz",
              "cuda13": "-bin-debian-trixie-cuda13-arm64.tar.gz",
              "vulkan": "-bin-debian-trixie-vulkan-arm64.tar.gz",
          }
          runtime_root_real = runtime_root.resolve()
          for key, suffix in required.items():
              asset = assets.get(key)
              if not isinstance(asset, dict):
                  raise SystemExit(f"llama runtime manifest missing asset: {key}")
              name = str(asset.get("name") or "").strip()
              rel = str(asset.get("path") or "").strip()
              if not name.endswith(suffix):
                  raise SystemExit(f"llama runtime asset {key} does not end with {suffix}: {name}")
              if not rel:
                  raise SystemExit(f"llama runtime asset {key} is missing path")
              archive = (runtime_root / rel).resolve()
              try:
                  archive.relative_to(runtime_root_real)
              except ValueError as exc:
                  raise SystemExit(f"llama runtime asset {key} escapes runtime root: {rel}") from exc
              if archive.name != name:
                  raise SystemExit(f"llama runtime asset {key} path/name mismatch: {rel} != {name}")
              if not archive.is_file():
                  raise SystemExit(f"bundled llama runtime archive missing: {rel}")
          if not any(path.is_file() for path in license_root.rglob("*")):
              raise SystemExit("llama runtime license files missing")
          PY
          if tar -tzf "$APP/Contents/Resources/PEGPURoot/legal/generated/source/PEGPU-app-source.tar.gz" | grep -E 'Resources/Guest/(scaling-app|performance-app)/(build|package)/|[.]deb$|__pycache__|[.]pyc$'; then
            echo "generated app source tarball must not include helper build artifacts" >&2
            exit 1
          fi
          if find "$APP/Contents/Resources/PEGPURoot" -maxdepth 2 -name 'THIRD_PARTY_*' -print -quit | grep -q .; then
            echo "legacy THIRD_PARTY notice files must not be bundled" >&2
            exit 1
          fi
          grep -F 'EXTERNAL PEGPU Machine Licenses' "$APP/Contents/Resources/PEGPURoot/legal/generated/NOTICES"
          grep -F 'ThirdPartyNotices/LICENSES' "$APP/Contents/Resources/PEGPURoot/legal/generated/NOTICES"
          grep -F 'For convenience, PEGPU.app Help can render external PEGPU Machine notices and licenses' "$APP/Contents/Resources/PEGPURoot/legal/generated/NOTICES"
          grep -F 'The Help menu marks those Machine-owned rows as EXTERNAL' "$APP/Contents/Resources/PEGPURoot/legal/generated/NOTICES"
          grep -F 'visible architecture, repository, license, notice, and source boundary' "$APP/Contents/Resources/PEGPURoot/legal/generated/NOTICES"
          grep -F 'PEGPU uses a stricter form of the UTM / UTM-QEMU-style architecture' "$APP/Contents/Resources/PEGPURoot/legal/generated/NOTICES"
          grep -F 'The app-visible LICENSES file is the consolidated license record for the installed PEGPU.app application/runtime distribution' "$APP/Contents/Resources/PEGPURoot/legal/generated/NOTICES"
          grep -F 'The legal records for those source archive contents are generated next to each archive' "$APP/Contents/Resources/PEGPURoot/legal/generated/NOTICES"
          grep -F 'Machine/QEMU license text is not copied into this PEGPU.app LICENSES file' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          grep -F 'This LICENSES file is the consolidated license record for the installed PEGPU.app application/runtime distribution' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          grep -F 'Component-Scope: PEGPU.app source code' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          grep -F 'Component-Scope: Bundled app-side display runtime dependency' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          grep -F 'Component-Scope: Bundled app-managed llama.cpp runtime archive' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          grep -F 'Package/Dependency: llama-swap routing provenance' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          grep -F 'Package/Dependency: llama.cpp' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          grep -F 'Package/Dependency: GOST/local proxy provenance' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          grep -F 'Package/Dependency: AI web UI/router provenance' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          grep -F 'Package/Dependency: Go module: web-ui-app' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          grep -F 'Package/Dependency: Go module: gopkg.in/yaml.v3' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          grep -F 'Package/Dependency: SwiftPM: swiftterm' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          grep -F 'Package/Dependency: SwiftPM: swift-argument-parser' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          grep -F 'Component-Scope: Swift package used by PEGPU.app' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          if awk '/^License:/ && $0 ~ /(GPL|AGPL)/ && $0 !~ /LGPL/ {print; bad=1} END {exit bad ? 0 : 1}' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"; then
            echo "PEGPU.app runtime/distribution LICENSES must not contain GPL-only dependency blocks" >&2
            exit 1
          fi
          if grep -E 'The following are distributed under GPL v2|gst-plugins-base-1[.]15[.]2[.]tar[.]xz|qemu-4[.]2[.]0[.]tar[.]xz' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"; then
            echo "PEGPU.app LICENSES must not include UTM aggregate app license text; use UTM Apache license/provenance instead" >&2
            exit 1
          fi
          if grep -E 'The following are distributed under GPL v2|gst-plugins-base-1[.]15[.]2[.]tar[.]xz|qemu-4[.]2[.]0[.]tar[.]xz' "$APP/Contents/Resources/PEGPURoot/legal/generated/source/"*.LICENSES; then
            echo "PEGPU.app source sidecar licenses must not include UTM aggregate app license text; use source-specific licenses/provenance instead" >&2
            exit 1
          fi
          if find "$APP/Contents/Resources/PEGPURoot/legal/generated/license-files" -type f | awk '{ lower=tolower($0); if ((lower ~ /agpl/ || lower ~ /gpl/) && lower !~ /lgpl/) { print; bad=1 } } END { exit bad ? 0 : 1 }'; then
            echo "PEGPU.app legal payload must not copy GPL/AGPL-only source license files into app-visible license-files" >&2
            exit 1
          fi
          if grep -E 'archives scanned|license/notice files harvested|license/notice files collected|Included License/Notice Files|Swift Package Pins|Go Modules|Bundle identifier' "$APP/Contents/Resources/PEGPURoot/legal/generated/NOTICES"; then
            echo "PEGPU.app NOTICES must be user-facing packaging/legal prose, not a raw generated audit inventory" >&2
            exit 1
          fi
          if grep -E '^- PEGPU Machine .*[(]missing[)]' "$APP/Contents/Resources/PEGPURoot/legal/generated/NOTICES"; then
            echo "PEGPU.app NOTICES must not describe external Machine legal paths with build-time missing status" >&2
            exit 1
          fi
          if grep -E 'archives scanned|license/notice files harvested|license/notice files collected|Included License/Notice Files|Swift Package Pins|Go Modules|Bundle identifier|records found' "$APP/Contents/Resources/PEGPURoot/legal/generated/source/"*.NOTICES; then
            echo "source archive NOTICES sidecars must be user-facing legal/source prose, not raw generated audit inventories" >&2
            exit 1
          fi
          grep -F 'Package/Dependency: ANGLE' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          awk 'BEGIN{found=0; in_angle=0} /^Package\/Dependency: ANGLE$/ {in_angle=1} in_angle && /^License:/ {if ($0 == "License: BSD-3-Clause") found=1; in_angle=0} END{exit found ? 0 : 1}' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          grep -F 'Package/Dependency: PEGPU.app' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          grep -F 'Package/Dependency: Display runtime: glib' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          grep -F 'Package/Dependency: Display runtime: openssl' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          grep -F 'Package/Dependency: Display runtime: gstreamer' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          grep -F 'Package/Dependency: Bundled llama.cpp runtime' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"
          if [ "$(grep -c '^Package/Dependency:' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES")" -lt 40 ]; then
            echo "PEGPU.app LICENSES is missing harvested bundled dependency license blocks" >&2
            exit 1
          fi
          if grep -F 'Package/Dependency: QEMU' "$APP/Contents/Resources/PEGPURoot/legal/generated/LICENSES"; then
            echo "PEGPU.app LICENSES must reference Machine/QEMU notices but not duplicate QEMU license blocks" >&2
            exit 1
          fi
          APP_EXECUTABLE="$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          APP_STRINGS="$RUNNER_TEMP/pegpu-app-strings.txt"
          strings "$APP/Contents/MacOS/$APP_EXECUTABLE" > "$APP_STRINGS"
          require_app_string_or_source() {
            needle="$1"
            if ! grep -F "$needle" "$APP_STRINGS" >/dev/null && ! grep -R -F "$needle" Sources/PEGPUApp >/dev/null; then
              echo "PEGPU.app is missing expected Help/legal string in built strings and source: $needle" >&2
              exit 1
            fi
          }
          require_app_string_or_source 'PEGPU Help'
          require_app_string_or_source 'PEGPU Machine Notices'
          require_app_string_or_source 'PEGPU Machine Licenses'
          require_app_string_or_source 'EXTERNAL'

      - name: Pack PEGPU.app artifact
        run: |
          mkdir -p "$RUNNER_TEMP/pegpu-artifacts/app-archive"
          tar -czf "$RUNNER_TEMP/pegpu-artifacts/app-archive/PEGPU-app.tar.gz" \
            -C "$RUNNER_TEMP/pegpu-artifacts/app" \
            PEGPU.app
          tar -tzf "$RUNNER_TEMP/pegpu-artifacts/app-archive/PEGPU-app.tar.gz" | grep -F 'PEGPU.app/Contents/MacOS/PEGPU'
          if tar -tzf "$RUNNER_TEMP/pegpu-artifacts/app-archive/PEGPU-app.tar.gz" | grep -F 'PEGPU.app/Contents/MacOS/PEGPUApp'; then
            echo "PEGPU.app must not ship with the old PEGPUApp executable name" >&2
            exit 1
          fi

      - name: Upload PEGPU.app archive
        uses: actions/upload-artifact@v7
        with:
          name: PEGPU-app-${{ env.MACOS_ARTIFACT_ABI }}
          path: ${{ runner.temp }}/pegpu-artifacts/app-archive/PEGPU-app.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Upload versioned PEGPU.app archive
        uses: actions/upload-artifact@v7
        with:
          name: PEGPU-app-${{ env.MACOS_ARTIFACT_ABI }}-v${{ env.RELEASE_VERSION }}
          path: ${{ runner.temp }}/pegpu-artifacts/app-archive/PEGPU-app.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Upload generated PEGPU notices and source
        uses: actions/upload-artifact@v7
        with:
          name: PEGPU-legal-generated-${{ env.MACOS_ARTIFACT_ABI }}
          path: ${{ runner.temp }}/pegpu-artifacts/legal/generated
          if-no-files-found: error
          retention-days: 90

  machine-artifacts:
    name: Build/fetch PEGPU Machine and DKMS guest tools
    runs-on: macos-14
    needs:
      - version
    if: ${{ always() && needs.version.result == 'success' && github.event_name == 'workflow_dispatch' && (inputs.build_scope || 'package') == 'package' && ((inputs.machine_mode || 'app-run') == 'app-run' || (inputs.machine_mode || 'app-run') == 'download-run') }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      MACHINE_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.machine_mode || 'app-run') || 'app-run' }}
      MACHINE_APP_RUN_ID: ${{ inputs.machine_app_run_id || vars.PEGPU_LEGACY_MACHINE_APP_RUN_ID || vars.PEGPU_MACHINE_APP_RUN_ID || '' }}
      MACHINE_RUN_ID: ${{ inputs.machine_run_id || '' }}

    steps:
      - name: Check out PEGPU
        uses: actions/checkout@v6

      - name: Validate Machine mode
        run: |
          case "${MACHINE_MODE}" in
            app-run|download-run) ;;
            *)
              echo "machine_mode must be app-run or download-run in the legacy artifact branch" >&2
              exit 1
              ;;
          esac

      - name: Resolve fallback Machine artifact run
        if: ${{ env.MACHINE_MODE == 'app-run' && env.MACHINE_APP_RUN_ID == '' }}
        run: |
          pages="$RUNNER_TEMP/pegpu-actions-artifacts.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > "$pages"
          run_id="$(python3 scripts/resolve-artifact-run.py "$pages" PEGPU-machine-artifacts)"
          test -n "$run_id"
          echo "MACHINE_APP_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "Resolved fallback Machine artifact from PEGPU run $run_id. Pin PEGPU_LEGACY_MACHINE_APP_RUN_ID or machine_app_run_id for repeatable legacy builds."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Require Machine artifact source
        run: |
          if [ "${MACHINE_MODE}" = "app-run" ] && [ -z "${MACHINE_APP_RUN_ID}" ]; then
            echo "machine_mode=app-run requires machine_app_run_id" >&2
            exit 1
          fi
          if [ "${MACHINE_MODE}" = "download-run" ] && [ -z "${MACHINE_RUN_ID}" ]; then
            echo "machine_mode=download-run requires machine_run_id" >&2
            exit 1
          fi

      - name: Download Machine artifacts from prior PEGPU workflow run
        if: ${{ env.MACHINE_MODE == 'app-run' }}
        run: |
          mkdir -p "$RUNNER_TEMP/pegpu-input/machine-app-run"
          gh run download "$MACHINE_APP_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name PEGPU-machine-artifacts \
            --dir "$RUNNER_TEMP/pegpu-input/machine-app-run"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Normalize Machine artifacts
        run: |
          if [ "${MACHINE_MODE}" = "app-run" ]; then
            export PEGPU_MACHINE_ARTIFACT_DIR="$RUNNER_TEMP/pegpu-input/machine-app-run"
          fi
          scripts/fetch-machine-artifacts.sh "$RUNNER_TEMP/pegpu-artifacts/machine"
        env:
          GH_TOKEN: ${{ secrets.PEGPU_MACHINE_TOKEN || github.token }}
          PEGPU_MACHINE_REPOSITORY: ${{ inputs.machine_repository || 'openresearchtools/PEGPU-machine' }}
          PEGPU_MACHINE_REF: ${{ inputs.machine_ref || 'main' }}
          PEGPU_MACHINE_RUN_ID: ${{ env.MACHINE_MODE == 'download-run' && inputs.machine_run_id || '' }}
          PEGPU_TRIGGER_MACHINE_BUILD: "0"
          PEGPU_REQUIRE_MACHINE_SOURCE: "1"
          PEGPU_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          PEGPU_BUILD_NUMBER: ${{ env.BUILD_NUMBER }}

      - name: Validate Machine app payload
        run: |
          APP="$RUNNER_TEMP/pegpu-artifacts/machine/PEGPU Machine.app"
          test -d "$APP"
          test -x "$APP/Contents/MacOS/PEGPU Machine"
          test -x "$APP/Contents/MacOS/qemu-vfio-apple"
          test -f "$APP/Contents/Resources/ThirdPartyNotices/NOTICES"
          test -f "$APP/Contents/Resources/ThirdPartyNotices/LICENSES"
          test -f "$APP/Contents/Resources/guest-tools/manifest.json"
          test -d "$APP/Contents/Resources/guest-tools/source"
          find "$APP/Contents/Resources/guest-tools/packages" -type f -name 'apple-dma-dkms_*.deb' -print -quit | grep -q .
          if find "$APP/Contents/Resources/guest-tools/packages" -type f -name 'apple-dma-modules-*.deb' -print -quit | grep -q .; then
            echo "Machine guest tools must not contain kernel-versioned DMA module packages" >&2
            exit 1
          fi
          find "$APP/Contents/Resources/guest-tools/source" -type f -name 'apple-dma-*.tar.gz' -print -quit | grep -q .
          find "$RUNNER_TEMP/pegpu-artifacts/machine" -maxdepth 1 -type f -name 'PEGPU-Machine-*-source.tar.gz' -print -quit | grep -q .
          if find "$RUNNER_TEMP/pegpu-artifacts/machine" -path '*/downloaded/*' -print -quit | grep -q .; then
            echo "Machine artifact must not recursively upload downloaded artifact scratch directories" >&2
            exit 1
          fi
          codesign --verify --deep --strict "$APP"

      - name: Upload Machine artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PEGPU-machine-artifacts
          path: ${{ runner.temp }}/pegpu-artifacts/machine
          if-no-files-found: error
          retention-days: 90

  package:
    name: Package installer
    runs-on: macos-14
    needs:
      - version
      - build-app
      - machine-artifacts
    if: ${{ always() && needs.version.result == 'success' && needs.build-app.result == 'success' && needs.machine-artifacts.result == 'success' }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}

    steps:
      - name: Check out PEGPU
        uses: actions/checkout@v6

      - name: Download PEGPU.app
        uses: actions/download-artifact@v8
        with:
          name: PEGPU-app-${{ env.MACOS_ARTIFACT_ABI }}
          path: ${{ runner.temp }}/pegpu-input/app-archive

      - name: Unpack PEGPU.app
        run: |
          mkdir -p "$RUNNER_TEMP/pegpu-input/app"
          tar -xzf "$RUNNER_TEMP/pegpu-input/app-archive/PEGPU-app.tar.gz" \
            -C "$RUNNER_TEMP/pegpu-input/app"
          codesign --verify --deep --strict "$RUNNER_TEMP/pegpu-input/app/PEGPU.app"

      - name: Download PEGPU legal payload
        uses: actions/download-artifact@v8
        with:
          name: PEGPU-legal-generated-${{ env.MACOS_ARTIFACT_ABI }}
          path: ${{ runner.temp }}/pegpu-input/legal

      - name: Download Machine artifacts
        uses: actions/download-artifact@v8
        with:
          name: PEGPU-machine-artifacts
          path: ${{ runner.temp }}/pegpu-input/machine

      - name: Rehydrate Machine app from archive
        run: |
          rm -rf "$RUNNER_TEMP/pegpu-input/machine-rehydrated"
          PEGPU_MACHINE_ARTIFACT_DIR="$RUNNER_TEMP/pegpu-input/machine" \
          PEGPU_REQUIRE_MACHINE_SOURCE=1 \
          scripts/fetch-machine-artifacts.sh "$RUNNER_TEMP/pegpu-input/machine-rehydrated"
          rm -rf "$RUNNER_TEMP/pegpu-input/machine"
          mv "$RUNNER_TEMP/pegpu-input/machine-rehydrated" "$RUNNER_TEMP/pegpu-input/machine"
          codesign --verify --deep --strict "$RUNNER_TEMP/pegpu-input/machine/PEGPU Machine.app"
          codesign -d --entitlements :- "$RUNNER_TEMP/pegpu-input/machine/PEGPU Machine.app" 2>/dev/null | grep -F 'com.apple.developer.system-extension.install'

      - name: Build pkg
        run: |
          VERSION="${RELEASE_VERSION}"
          PACKAGE_CHANNEL="artifact"
          PKG_NAME="PEGPU-v${VERSION}-${MACOS_ARTIFACT_LABEL}.pkg"
          OUT="$RUNNER_TEMP/pegpu-artifacts/pkg/$PKG_NAME"
          mkdir -p "$(dirname "$OUT")" "$RUNNER_TEMP/pegpu-check"
          export PEGPU_MACHINE_APP="$RUNNER_TEMP/pegpu-input/machine/PEGPU Machine.app"
          export PEGPU_REQUIRE_MACHINE_APP=1
          export PEGPU_REQUIRE_MACHINE_SOURCE=1
          PEGPU_APP="$RUNNER_TEMP/pegpu-input/app/PEGPU.app" \
          PEGPU_PKG_BUILD_DIR="$RUNNER_TEMP/pegpu-build/pkg" \
          PEGPU_PACKAGE_CHANNEL="$PACKAGE_CHANNEL" \
          VERSION="$VERSION" \
          OUT="$OUT" \
          scripts/build-release-pkg.sh
          test -f "$OUT"
          pkgutil --expand "$OUT" "$RUNNER_TEMP/pegpu-check/pkg-expanded"
          test -f "$RUNNER_TEMP/pegpu-check/pkg-expanded/Distribution"
          grep -F 'hostArchitectures="arm64"' "$RUNNER_TEMP/pegpu-check/pkg-expanded/Distribution"
          grep -R -F 'For convenience, PEGPU.app Help can render external PEGPU Machine notices and licenses' "$RUNNER_TEMP/pegpu-check/pkg-expanded"
          grep -R -F 'The Help menu marks those Machine-owned rows as EXTERNAL' "$RUNNER_TEMP/pegpu-check/pkg-expanded"
          grep -R -F 'PEGPU uses a stricter form of the UTM / UTM-QEMU-style' "$RUNNER_TEMP/pegpu-check/pkg-expanded"
          grep -R -F 'The installed license texts are the controlling terms' "$RUNNER_TEMP/pegpu-check/pkg-expanded"
          grep -R -F '/Library/SystemExtensions' "$RUNNER_TEMP/pegpu-check/pkg-expanded/Distribution"
          grep -R -F 'driverStatusKnownMissing()' "$RUNNER_TEMP/pegpu-check/pkg-expanded/Distribution"
          grep -R -F 'start_selected="driverNeedsRefresh()"' "$RUNNER_TEMP/pegpu-check/pkg-expanded/Distribution"
          grep -R -F '<line choice="com.pegpu.install.app"/>' "$RUNNER_TEMP/pegpu-check/pkg-expanded/Distribution"
          grep -R -F '<line choice="com.pegpu.install.machine"/>' "$RUNNER_TEMP/pegpu-check/pkg-expanded/Distribution"
          grep -R -F 'SIP must be disabled before this can be installed' "$RUNNER_TEMP/pegpu-check/pkg-expanded/Distribution"
          if grep -R -F 'com.pegpu.status.' "$RUNNER_TEMP/pegpu-check/pkg-expanded/Distribution"; then
            echo "installer customization screen must not expose cosmetic status choices" >&2
            exit 1
          fi
          if grep -R -E 'SIP disabled|PEGPU Machine[.]app missing or older|DriverKit extension status unavailable' "$RUNNER_TEMP/pegpu-check/pkg-expanded/Distribution"; then
            echo "installer customization screen must not expose SIP/Machine/DriverKit status rows" >&2
            exit 1
          fi
      - name: Gather package assets
        run: |
          VERSION="${RELEASE_VERSION}"
          ASSETS="$RUNNER_TEMP/pegpu-artifacts/release-assets"
          mkdir -p "$ASSETS"
          pkg="$(find "$RUNNER_TEMP/pegpu-artifacts/pkg" -maxdepth 1 -type f -name 'PEGPU-v*.pkg' -print -quit)"
          test -n "$pkg"
          cp "$pkg" "$ASSETS/"
          test "$(find "$ASSETS" -maxdepth 1 -type f -name 'PEGPU-v*.pkg' | wc -l | tr -d ' ')" = "1"
          find "$ASSETS" -maxdepth 1 -type f -print | sort

      - name: Upload package assets
        uses: actions/upload-artifact@v7
        with:
          name: PEGPU-package-assets-${{ env.MACOS_ARTIFACT_ABI }}
          path: ${{ runner.temp }}/pegpu-artifacts/release-assets
          if-no-files-found: error
          retention-days: 90

      - name: Upload versioned package assets
        uses: actions/upload-artifact@v7
        with:
          name: PEGPU-package-assets-${{ env.MACOS_ARTIFACT_ABI }}-v${{ env.RELEASE_VERSION }}
          path: ${{ runner.temp }}/pegpu-artifacts/release-assets
          if-no-files-found: error
          retention-days: 90
